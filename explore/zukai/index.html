<style>

/* ---------- builders ---------- */
const norm=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]};
function roundPath(pts,r){
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),rr=Math.min(r,l1/2,l2/2);
    d+=` L${x1-(x1-x0)/l1*rr} ${y1-(y1-y0)/l1*rr} Q${x1} ${y1} ${x1+(x2-x1)/l2*rr} ${y1+(y2-y1)/l2*rr}`;
  }
  const p=pts[pts.length-1];return d+` L${p[0]} ${p[1]}`;
}
function geom(g,trim){
  if(g.curve){const[p0,c,p1]=g.curve,dir=norm(c,p1),e=[p1[0]-dir[0]*trim,p1[1]-dir[1]*trim];
    return{d:`M${p0[0]} ${p0[1]} Q${c[0]} ${c[1]} ${e[0]} ${e[1]}`,tip:p1,dir}}
  const pts=g.pts.map(p=>p.slice()),n=pts.length,dir=norm(pts[n-2],pts[n-1]),tip=pts[n-1].slice();
  pts[n-1]=[tip[0]-dir[0]*trim,tip[1]-dir[1]*trim];
  return{d:roundPath(pts,14),tip,dir};
}
function setPos(g,p,L){
  g.style.transform=`translate(${p[0]}px,${p[1]}px)`;
  if(g._side!==p[2]){g._side=p[2];placeLabel(g._lab,g._def,p[2],L)}
}
function placeLabel(lab,def,side,L){
  lab.innerHTML='';const tall=L.name==='tall';
  if(side==='below'){txt(lab,def.name,0,tall?45:43,'nm halo');if(def.sub)txt(lab,def.sub,0,tall?63:60,'sb halo')}
  else if(side==='above'){if(def.sub){txt(lab,def.name,0,tall?-52:-50,'nm halo');txt(lab,def.sub,0,-34,'sb halo')}else txt(lab,def.name,0,-36,'nm halo')}
  else{txt(lab,def.name,34,def.sub?-1:5,'nm halo','start');if(def.sub)txt(lab,def.sub,34,17,'sb halo','start')}
}
function pill(parent,x,y,w,h,cls){return el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:h/2,class:cls},parent)}

function build(svg,L,pre,mini){

/* ---------- state application ---------- */
let timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function applyState(D,st,animate){
  const show=new Set(st.show),dim=new Set(st.dim||[]),cls=st.cls||{},delay=st.delay||{};
  const pos=(st.pos&&st.pos[D.L.name])||{};
  for(const[k,e]of D.els){
    const on=show.has(k),was=e.classList.contains('on');
    e.classList.toggle('on',on);
    e.classList.toggle('dim',on&&dim.has(k));
    e.classList.toggle('held',cls[k]==='held');
    if(e._tok)setPos(e,pos[k]||D.L.A[k],D.L);
    if(!on||!was||!animate)e.getAnimations({subtree:true}).forEach(a=>a.cancel());
    if(on&&!was&&animate)reveal(e,delay[k]||0);
  }
  const c=D.els.get('counter');
  if(c){
    if(st.count&&animate){
      c._t.textContent='0/4 ödendi';
      [1,2,3,4].forEach(i=>later(()=>{c._t.textContent=i+'/4 ödendi'},(delay['tag-'+PEOPLE[i-1]]||0)+150));
    }else c._t.textContent='4/4 ödendi';
  }
}
function reveal(e,d){
  const ease='cubic-bezier(.45,0,.2,1)';
  if(e._mp){
    e._mp.animate([{strokeDashoffset:'1px'},{strokeDashoffset:'0px'}],{duration:750,delay:d,easing:ease,fill:'backwards'});
    e._hd.animate([{opacity:0},{opacity:1}],{duration:200,delay:d+650,fill:'backwards'});
    e._lb.animate([{opacity:0},{opacity:1}],{duration:300,delay:d+400,fill:'backwards'});
  }else e.animate([{opacity:0},{opacity:1}],{duration:450,delay:d,easing:ease,fill:'backwards'});
}

const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=0,mode='main',playing=false,ptimer=null,D=null,layoutName='';
const bar=document.getElementById('bar');
bar.innerHTML=FR.map(()=>'<i><b></b></i>').join('');

function pickLayout(){const r=stage.getBoundingClientRect();return(r.width<720||r.width/Math.max(r.height,1)<1.3)?'tall':'wide'}
function rebuild(){
  const n=pickLayout();if(n===layoutName&&D)return false;
  layoutName=n;const L=LAY[n];
  svg.innerHTML='';svg.setAttribute('viewBox',L.vb.join(' '));svg.setAttribute('class',n);
  D=build(svg,L,'x',false);
  return true;
}
function render(animate,toggle){
  timers.forEach(clearTimeout);timers=[];
  const f=FR[cur],st=(mode==='alt'&&f.alt)?f.alt:f.s;
  if(!animate){svg.classList.add('instant')}
  applyState(D,st,animate&&!RM);
  if(!animate)setTimeout(()=>svg.classList.remove('instant'),60);
  legend(st);
  const seg=document.getElementById('seg');
  seg.classList.toggle('off',!f.alt);
  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
  const cap=st.c||f.c;if(toggle)document.getElementById('c').textContent=cap;
  svg.setAttribute('aria-label',f.h+' '+cap);
}
function setText(animate){
  const t=document.getElementById('text'),f=FR[cur];
  const put=()=>{document.getElementById('h').textContent=f.h;document.getElementById('c').textContent=f.c;t.classList.remove('fade')};
  if(animate&&!RM){t.classList.add('fade');setTimeout(put,180)}else put();
  document.getElementById('fig').textContent=`Şekil ${cur+1} / ${FR.length}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===FR.length-1;
}
function paintBar(){
  [...bar.children].forEach((s,i)=>{s.className=i<cur?'done':(i===cur?(playing?'run':'done'):'');
    if(i===cur&&playing){s.style.setProperty('--d',(FR[cur].dur||9000)+'ms');s.className='';void s.offsetWidth;s.className='run'}});
}
function go(i,animate=true){
  i=Math.max(0,Math.min(FR.length-1,i));
  const fwd=i>cur;cur=i;mode='main';
  setText(animate);render(animate&&fwd);
  history.replaceState(null,'','#'+(cur+1));
  schedule();paintBar();
}
function schedule(){
  clearTimeout(ptimer);
  if(!playing)return;
  ptimer=setTimeout(()=>{if(cur<FR.length-1)go(cur+1);else setPlay(false)},FR[cur].dur||9000);
}
function setPlay(on){
  playing=on;
  document.getElementById('playTx').textContent=on?'Duraklat':'Oynat';
  document.getElementById('playIc').innerHTML=on?'<path d="M5 3.5v9M11 3.5v9" stroke-width="2"/>':'<path d="M5 3.5v9l7-4.5z" fill="currentColor"/>';
  if(on&&cur===FR.length-1){go(0);return}
  schedule();paintBar();
}
const next=()=>go(cur+1),prev=()=>go(cur-1);
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('play').onclick=()=>setPlay(!playing);
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  if(mode===b.dataset.m)return;mode=b.dataset.m;setPlay(false);render(true,true);
});
stage.addEventListener('click',next);
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(FR.length-1);
});
let tx=null,ty=null;
addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
addEventListener('touchend',e=>{
  if(tx===null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){dx<0?next():prev()}
},{passive:true});
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=FR.length&&n-1!==cur)go(n-1,false)});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(rebuild())render(false)},120)});

const h=parseInt(location.hash.slice(1),10);
cur=(h>=1&&h<=FR.length)?h-1:0;
rebuild();setText(false);render(false);paintBar();
</script>
</body>
</html>
