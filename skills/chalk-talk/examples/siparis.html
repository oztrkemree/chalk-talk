/* ---------- page ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background-color:var(--bg); background-image:var(--bg-image); background-size:var(--bg-size); color:var(--ink); font-family:var(--ui-f); -webkit-font-smoothing:antialiased; transition:background-color .35s ease}
.app{width:min(100%, calc((100vh - 150px) * 16 / 9)); min-width:min(100%, 640px); margin:0 auto; padding:10px 16px 14px}
#board{width:100%; height:auto; display:block; overflow:visible; user-select:none; -webkit-user-select:none; cursor:pointer; touch-action:pan-y}

/* ---------- category colors: a node sets --cbg / --cfg, its parts use them ---------- */
.c-sky{--cbg:var(--c-sky-bg);--cfg:var(--c-sky-fg)} .c-mint{--cbg:var(--c-mint-bg);--cfg:var(--c-mint-fg)}
.c-butter{--cbg:var(--c-butter-bg);--cfg:var(--c-butter-fg)} .c-lilac{--cbg:var(--c-lilac-bg);--cfg:var(--c-lilac-fg)}
.c-peach{--cbg:var(--c-peach-bg);--cfg:var(--c-peach-fg)} .c-rose{--cbg:var(--c-rose-bg);--cfg:var(--c-rose-fg)}
.c-sage{--cbg:var(--c-sage-bg);--cfg:var(--c-sage-fg)} .c-sand{--cbg:var(--c-sand-bg);--cfg:var(--c-sand-fg)}
.c-white{--cbg:var(--c-white-bg);--cfg:var(--c-white-fg)} .c-none{--cbg:var(--c-none-bg);--cfg:var(--c-none-fg)}
.c-sky{--ctop:var(--c-sky-top);--cl:var(--c-sky-l);--cr:var(--c-sky-r);--cink:var(--c-sky-ink)} .c-mint{--ctop:var(--c-mint-top);--cl:var(--c-mint-l);--cr:var(--c-mint-r);--cink:var(--c-mint-ink)}
.c-butter{--ctop:var(--c-butter-top);--cl:var(--c-butter-l);--cr:var(--c-butter-r);--cink:var(--c-butter-ink)} .c-lilac{--ctop:var(--c-lilac-top);--cl:var(--c-lilac-l);--cr:var(--c-lilac-r);--cink:var(--c-lilac-ink)}
.c-peach{--ctop:var(--c-peach-top);--cl:var(--c-peach-l);--cr:var(--c-peach-r);--cink:var(--c-peach-ink)} .c-rose{--ctop:var(--c-rose-top);--cl:var(--c-rose-l);--cr:var(--c-rose-r);--cink:var(--c-rose-ink)}
.c-sage{--ctop:var(--c-sage-top);--cl:var(--c-sage-l);--cr:var(--c-sage-r);--cink:var(--c-sage-ink)} .c-sand{--ctop:var(--c-sand-top);--cl:var(--c-sand-l);--cr:var(--c-sand-r);--cink:var(--c-sand-ink)}
.c-white{--ctop:var(--c-white-top);--cl:var(--c-white-l);--cr:var(--c-white-r);--cink:var(--c-white-ink)} .c-none{--ctop:var(--c-none-top);--cl:var(--c-none-l);--cr:var(--c-none-r);--cink:var(--c-none-ink)}

/* ---------- text roles ---------- */
.t-label{font-family:var(--label-f);font-size:var(--label-s);font-weight:var(--label-w);fill:var(--ink)}
.t-sub{font-family:var(--sub-f);font-size:var(--sub-s);font-weight:var(--sub-w);fill:var(--muted)}
.t-edge{font-family:var(--edge-f);font-size:var(--edge-s);font-weight:var(--edge-w);fill:var(--ink-2)}
.t-num{font-family:var(--num-f);font-size:var(--num-s);font-weight:var(--num-w);fill:var(--num-fg)}
.t-note{font-family:var(--note-f);font-size:var(--note-s);font-weight:var(--note-w);font-style:var(--note-i,normal);fill:var(--ink-2)}
.t-tag{font-family:var(--tag-f);font-size:var(--tag-s);font-weight:var(--tag-w);letter-spacing:var(--tag-ls,0)}
.t-title{font-family:var(--title-f);font-size:var(--title-s);font-weight:var(--title-w);fill:var(--ink);letter-spacing:-.015em}

[data-style="blueprint"] .t-title{letter-spacing:0}

.avatar{fill:var(--cbg); stroke:var(--line); stroke-width:1.25}

.edge.t-error{color:var(--error)} .edge.t-warn{color:var(--warn)} .edge.t-info{color:var(--info)}

.note.t-ok .note-bar,.note.t-ok .note-dot{fill:var(--ok)} .note.t-ok .note-lead{stroke:var(--ok)}
.note.t-error .note-bar,.note.t-error .note-dot{fill:var(--error)} .note.t-error .note-lead{stroke:var(--error)}
.note.t-warn .note-bar,.note.t-warn .note-dot{fill:var(--warn)} .note.t-warn .note-lead{stroke:var(--warn)}
.note.t-info .note-bar,.note.t-info .note-dot{fill:var(--info)} .note.t-info .note-lead{stroke:var(--info)}
.chip{fill:var(--info-bg)} .tag .t-tag{fill:var(--info)}
.tag.t-ok .chip{fill:var(--ok-bg)} .tag.t-ok .t-tag{fill:var(--ok)}

.k-cloud :is(.iso-top,.iso-l),.k-actor :is(.iso-l,.iso-r){stroke:none}

.iso-ao{fill:url(#iso-ao-g); stroke:none} .ao-0{stop-color:var(--ao); stop-opacity:0} .ao-1{stop-color:var(--ao); stop-opacity:var(--ao-o)}

.fx{opacity:0}

.ctl button.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.ctl button[hidden]{display:none}
.ctl button[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.ctl svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* ---------- code panel: click a node (or press C) to see the real code behind it ---------- */

#code-body{flex:1; margin:0; overflow:auto; padding:10px 0 16px; font:13px/1.6 var(--ui-mono); tab-size:4; counter-reset:ln var(--ln0)}
#code-body .ln{display:block; padding:0 18px 0 0; white-space:pre}
#code-body .ln::before{counter-increment:ln; content:counter(ln); display:inline-block; width:4.2em; padding-right:1.2em; text-align:right; color:var(--muted); user-select:none}
#code-body .ln.mark{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}

.tk-c{color:var(--muted); font-style:italic} .tk-s{color:var(--ok)} .tk-k{color:var(--accent); font-weight:500} .tk-n{color:var(--warn)}

#code-proof{font:500 12.5px/1.4 var(--ui-f); margin-top:3px; white-space:normal; color:var(--pm-c, var(--ink-2))}

.chg-added{--chg:var(--ok); --chg-bg:var(--ok-bg)} .chg-changed{--chg:var(--warn); --chg-bg:var(--warn-bg)} .chg-removed{--chg:var(--error); --chg-bg:var(--error-bg)}

.chg-halo{fill:var(--chg-bg); stroke:none}
.chg-removed .chg-ring{stroke-dasharray:5 4}
.chg-removed .chg-halo{fill:none}
.chg-tag rect{fill:var(--chg-bg)} .chg-tag .chg-tag-base{fill:var(--card)} .chg-tag .t-tag{fill:var(--chg)}
.edge:is(.chg-added,.chg-changed) .iso-track{stroke:var(--chg); opacity:.24}
html:not(.diff-before) .chg-removed > .node{opacity:.42}
html:is([data-style="iso"],[data-style="chalk"]):not(.diff-before) .chg-removed > .node{filter:grayscale(1)}
html:not(.diff-before) .edge.chg-removed{color:var(--error)}
html:not(.diff-before) .edge.chg-removed :is(.edge-line,.iso-path){stroke-dasharray:4 6; opacity:.7}

/* ---------- header chips (top right): change summary and the proof legend ---------- */
.hud-bg{fill:var(--card); stroke:var(--line-2); stroke-width:1}
:is([data-style="iso"],[data-style="chalk"]) .hud-bg{fill:var(--pill); stroke:var(--pill-line)}
.hud .t-sub{fill:var(--ink-2)}

#hud-proof{display:none}
.proof-view #hud-proof{display:inline}

.seeking *{transition:none !important}

.mtitle{display:none}
.fatal{font:15px/1.5 ui-monospace,Menlo,monospace; color:#DC3B3B; padding:24px; white-space:pre-wrap}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

   ===================================================================== */
const SEQ = S.layout === 'sequence';
const nodes = new Map(), edges = new Map(), groups = new Map(), all = new Map();

arr(S.nodes).forEach((d, i) => {
  const id = String(d.id || `n${i + 1}`);
  if (all.has(id)) issue('error', id, 'duplicate id');
  let kind = d.kind ? (ALIAS[d.kind] || d.kind) : 'box';
  if (!KINDS.has(kind)) { issue('warn', id, `unknown kind "${d.kind}", drawn as box`); kind = 'box'; }
  let color = COLOR_ALIAS[d.color] || d.color || DEFAULT_COLOR[kind];
  if (!COLORS.has(color)) { issue('warn', id, `unknown color "${d.color}"`); color = DEFAULT_COLOR[kind]; }
  if (d.icon && !ICONS[d.icon]) issue('warn', id, `unknown icon "${d.icon}" (known: ${Object.keys(ICONS).join(', ')})`);
  const n = { ...d, id, kind, color, type: 'node' };

arr(S.edges).forEach((d, i) => {
  const id = String(d.id || `e${i + 1}`);
  if (all.has(id)) issue('error', id, 'duplicate id');
  if (!nodes.has(d.from) || !nodes.has(d.to)) { issue('error', id, `edge needs existing "from" and "to" nodes (got ${d.from} -> ${d.to})`); return; }
  const tone = d.tone && TONES.has(d.tone) ? d.tone : (d.tone ? (issue('warn', id, `unknown tone "${d.tone}"`), 'ink') : 'ink');
  const e = { ...d, id, tone, type: 'edge', dashed: d.style === 'dashed' || d.dashed === true };
  edges.set(id, e); all.set(id, e);

arr(S.groups).forEach((d, i) => {

  const members = arr(d.members).filter(m => nodes.has(m) || (issue('error', id, `group member "${m}" is not a node`), false));
  if (!members.length) return;
  const g = { ...d, id, members, type: 'group' };

const steps = (arr(S.steps).length ? arr(S.steps) : [{ title: S.title || '', recap: true }]).map((d, k) => ({

  flow: arr(d.flow).map(f => typeof f === 'string' ? { edge: f } : { ...f, edge: String(f.edge) }),
  notes: arr(d.notes).map(n => typeof n === 'string' ? { text: n } : n),
  recap: !!d.recap, dim: d.dim, together: !!d.together, wait: d.wait,

const known = (id, k, what) => all.has(id) || (issue('error', `step ${k + 1}`, `${what} "${id}" does not exist`), false);
let vis = new Set();
steps.forEach(st => {
  const added = [];
  const add = id => { if (!vis.has(id)) { vis.add(id); added.push(id); } };
  const addAny = id => { const o = all.get(id); if (!o) return; if (o.type === 'edge') { add(o.from); add(o.to); } add(id); };
  if (st.recap) { nodes.forEach((o, id) => add(id)); groups.forEach((o, id) => add(id)); edges.forEach((o, id) => add(id)); }
  st.show.forEach(id => known(id, st.k, 'show') && addAny(id));
  st.flow.forEach(f => {
    if (!known(f.edge, st.k, 'flow edge')) return;
    if (all.get(f.edge).type !== 'edge') { issue('error', `step ${st.k + 1}`, `flow "${f.edge}" is not an edge`); return; }
    addAny(f.edge);

  st.notes.forEach(n => n.on && known(n.on, st.k, 'note target') && addAny(n.on));

  if (!PROOF) return null;
  const p = e.proof, src = p.file ? p : e.code && e.code.file ? e.code : null;
  const at = src ? ` in ${src.file}${src.start ? ':' + src.start + (src.end > src.start ? '-' + src.end : '') : ''}` : '';

if (nodes.size > 12) issue('warn', 'scene', `${nodes.size} nodes; above ~12 a talk gets crowded, consider two talks`);
if (steps.length > 10) issue('warn', 'scene', `${steps.length} steps; 4-8 usually tells it better`);
const MODEL_ISSUES = report.issues.length;

/* =====================================================================
   layout
   ===================================================================== */
let L = {};           // svg layers
let toGrid;           // grid coordinate -> canvas point (after centering)
let titleBox = rect(0, 0, 0, 0);

let narrow = 0;   // set when the board is too tight: long labels then wrap to two lines
function measureNode(n) {
  if (ISO) return measureIso(n);
  const lab = M.label, sub = M.sub;
  const maxW = n.maxWidth || (n.kind === 'actor' ? 190 : 230 - narrow);
  n.lines = n.label != null && n.label !== '' ? wrapBalanced(n.label, 'label', maxW) : [];
  const lw = widest(n.lines, 'label'), sw = n.sub ? tw(n.sub, 'sub') : 0;
  const textH = n.lines.length * lab.lh + (n.sub ? sub.lh + 3 : 0);
  n.icon2 = n.icon && ICONS[n.icon] ? n.icon : DEFAULT_ICON[n.kind];
  let w, h;
  if (n.kind === 'actor') { w = Math.max(96, lw + 8, sw + 8); h = 60 + 12 + textH; }
  else if (n.kind === 'text') { w = Math.max(20, lw + 8, sw + 8); h = Math.max(lab.lh, textH); }
  else { w = Math.max(150, CARD.pad + CARD.tile + CARD.gap + Math.max(lw, sw) + CARD.pad + 6); h = Math.max(CARD.tile + CARD.pad * 2 + 2, textH + CARD.pad * 2); }

  n.h = typeof n.height === 'number' ? n.height : h;
  if (n.label && String(n.label).length > 34) issue('warn', n.id, `label is ${String(n.label).length} chars; put detail in "sub" or a note`);
}

function layout() {
  report.issues.length = MODEL_ISSUES; debugBoxes.length = 0; narrow = 0;   // layout can run twice (late fonts)
  nodes.forEach(measureNode);
  if (SEQ) { layoutSequence(); steps.forEach(placeNotes); return; }
  const list = [...nodes.values()];
  let nextCol = Math.max(0, ...list.filter(n => Array.isArray(n.at)).map(n => Math.round(n.at[0]) + 1));
  list.forEach(n => {
    if (!Array.isArray(n.at)) { issue('warn', n.id, 'node has no "at": [col, row]; appended to row 0'); n.at = [nextCol++, 0]; }
    n.at = [Math.max(0, +n.at[0] || 0), Math.max(0, +n.at[1] || 0)];
  });
  if (ISO) { layoutIso(list); steps.forEach(placeNotes); return; }
  let tracks = gridTracks(list);
  if (tracks.squeeze < 0.8 && !narrow) {
    narrow = 80; nodes.forEach(measureNode); tracks = gridTracks(list);
  }
  const { px, py } = tracks;
  nodes.forEach(n => {
    const nd = arr(n.nudge);
    n.cx = px(n.at[0]) + (nd[0] || 0); n.cy = py(n.at[1]) + (nd[1] || 0);
    n.box = rect(n.cx - n.w / 2, n.cy - n.h / 2, n.w, n.h);
  });

  // center the drawing inside the board area
  const bb = unionRect([...[...nodes.values()].map(n => n.box), ...[...groups.values()].map(g => g.box)]);
  const dx = S.center === false ? AREA.x : AREA.x + (AREA.w - bb.w) / 2 - bb.x;
  const dy = S.center === false ? AREA.y : AREA.y + (AREA.h - bb.h) / 2 - bb.y;
  nodes.forEach(n => { n.cx += dx; n.cy += dy; n.box = rect(n.cx - n.w / 2, n.cy - n.h / 2, n.w, n.h); });
  groupRects();
  toGrid = (c, r) => [px(c) + dx, py(r) + dy];
  if (bb.w > AREA.w + 40 || bb.h > AREA.h + 40) issue('error', 'scene', `drawing is ${Math.round(bb.w)}x${Math.round(bb.h)}, board fits ${AREA.w}x${AREA.h}; use fewer columns/rows or shorter labels`);
  nodes.forEach(n => {
    if (!inCanvas(n.box, 6)) { issue('error', n.id, 'node is outside the board'); debugBoxes.push(n.box); }
  });
  const ns = [...nodes.values()];
  for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
    if (hit(pad(ns[i].box, 8), ns[j].box)) { issue('error', `${ns[i].id} + ${ns[j].id}`, 'nodes overlap; move one to another grid cell or shorten labels'); debugBoxes.push(ns[i].box, ns[j].box); }
  }
  groups.forEach(g => ns.forEach(n => {
    if (!g.members.includes(n.id) && hit(g.box, n.box)) { issue('warn', `${g.id} + ${n.id}`, `group "${g.id}" covers non-member "${n.id}"`); debugBoxes.push(n.box); }
  }));

  steps.forEach(placeNotes);
}

/* Grid tracks sized by content, like CSS grid "auto": a column is as wide as its widest node,

  edges.forEach(e => {
    const A = nodes.get(e.from), B = nodes.get(e.to);
    const dc = Math.abs(col(A) - col(B)), dr = Math.abs(row(A) - row(B));

    const lwWrapped = Math.min(lw, Math.max(130, lw * 0.56));             // short arrows wrap their label to two lines

/* Sequence layout: participants stand in a row, each with a lifeline; every edge is a
   message, one row lower than the previous, in the order the steps first mention them. */
function layoutSequence() {
  if (groups.size) issue('warn', 'scene', 'groups are not drawn in the sequence layout');
  const parts = [...nodes.values()].map((n, i) => ({ n, k: Array.isArray(n.at) ? +n.at[0] : i })).sort((a, b) => a.k - b.k).map(o => o.n);
  const idx = new Map(parts.map((n, i) => [n.id, i]));

  const widths = parts.map(n => n.w), gaps = Array(Math.max(0, P - 1)).fill(110 * sp);
  const order = [], seen = new Set();
  const see = id => { const o = all.get(id); if (o && o.type === 'edge' && !seen.has(id)) { seen.add(id); order.push(o); } };
  steps.forEach(st => { st.show.forEach(see); st.flow.forEach(f => see(f.edge)); st.focus.forEach(see); st.notes.forEach(n => n.on && see(n.on)); st.active.forEach(see); });
  edges.forEach((e, id) => see(id));
  order.forEach(e => {
    edgeLabelSize(e, 260);
    const a = idx.get(e.from), b = idx.get(e.to), pw = e.packet ? (tw(e.packet, 'packet') + 34) * 0.4 : 0;
    if (a === b) { e.selfSide = a < P - 1 ? 1 : -1; if (P > 1) widenGaps(gaps, widths, Math.min(a, a + e.selfSide), Math.max(a, a + e.selfSide), e.lsize[0] + 84); }
    else widenGaps(gaps, widths, Math.min(a, b), Math.max(a, b), e.lsize[0] + pw + 56);
  });

  const headH = Math.max(...parts.map(n => n.h)), rows = order.length;
  const maxLabelH = Math.max(28, ...order.map(e => e.lsize[1]));
  const rowGap = clamp((AREA.h - headH - 96) / Math.max(1, rows), maxLabelH + 12, 68);
  const totalH = headH + 52 + Math.max(0, rows - 1) * rowGap + 60;
  const x0 = AREA.x + (AREA.w - totalW) / 2, top = AREA.y + Math.max(0, (AREA.h - totalH) / 2);
  parts.forEach((n, i) => {
    n.cx = x0 + xs[i]; n.cy = top + headH / 2;
    n.box = rect(n.cx - n.w / 2, n.cy - n.h / 2, n.w, n.h);
    if (ISO) placeIso(n, n.cx - (n.rel.x + n.rel.w / 2), n.cy - (n.rel.y + n.rel.h / 2));

  order.forEach((e, r) => {
    const A = nodes.get(e.from), B = nodes.get(e.to), y = y0 + r * rowGap, [w, h] = e.lsize;
    if (A === B) {

      e.corners = [[x, y], [x + 44 * sd, y], [x + 44 * sd, y + 22], [x + 8 * sd, y + 22]];
      e.lbox = e.label || e.num != null ? rect(sd > 0 ? x + 54 : x - 54 - w, y + 11 - h / 2, w, h) : null;
    } else {
      const dir = Math.sign(B.cx - A.cx) || 1, x1 = A.cx + dir * 6, x2 = B.cx - dir * 7;

      if (w > Math.abs(x2 - x1) + 30) issue('warn', e.id, `label "${e.label}" is wider than its message arrow; shorten it`);
    }
    e.pts = polyPts(e.corners);
    e.len = polyLen(e.pts);
    if (e.lbox && !inCanvas(e.lbox, 6)) { issue('error', e.id, 'message label is outside the board'); debugBoxes.push(e.lbox); }
  });

  if (yEnd > AREA.y + AREA.h + 30) issue('error', 'scene', `${rows} messages do not fit on one board; split the exchange into two talks`);
  if (totalW > AREA.w + 30) issue('error', 'scene', `participants need ${Math.round(totalW)}px, the board has ${AREA.w}; drop a participant or shorten labels`);
  for (let i = 0; i < P; i++) for (let j = i + 1; j < P; j++) if (hit(pad(parts[i].box, 6), parts[j].box)) { issue('error', `${parts[i].id} + ${parts[j].id}`, 'participants overlap; shorten their labels'); debugBoxes.push(parts[i].box); }
}

function groupRects() {

}

/* ---------- header chips, top right: what the PR changed, and (proof view) the proof legend ---------- */

}

  playTimer = setTimeout(() => last ? go(0) : go(cur + 1), Math.max(timing.t + read, timing.flowT || 0) + (last ? 1200 : 0));
}
function play() { playing = true; $('play').setAttribute('aria-label', 'Pause'); $('play-i').setAttribute('d', 'M8 5.5v13M16 5.5v13'); if (cur >= steps.length - 1) go(0); else schedule({ t: 600, flowT: 0 }); }
function stop() { playing = false; clearTimeout(playTimer); $('play').setAttribute('aria-label', 'Play'); $('play-i').setAttribute('d', 'M8 5.5v13l10.5-6.5z'); }

/* ---------- code panel: the real code behind a node or arrow ---------- */
const EDITORS = {
  vscode: ['VS Code', (p, l) => `vscode://file${encodeURI(p)}:${l}`],
  cursor: ['Cursor', (p, l) => `cursor://file${encodeURI(p)}:${l}`],
  zed: ['Zed', (p, l) => `zed://file${encodeURI(p)}:${l}`],
  idea: ['IntelliJ', (p, l) => `idea://open?file=${encodeURIComponent(p)}&line=${l}`],
};
const KW = 'const|let|var|function|return|if|else|elif|for|while|do|await|async|import|from|export|default|class|new|try|catch|except|finally|throw|raise|def|self|this|super|None|True|False|null|nil|undefined|true|false|func|go|defer|type|struct|interface|enum|public|private|protected|static|void|fn|pub|impl|match|use|mod|package|extends|implements|lambda|with|as|yield|case|switch|break|continue|pass|end|then|local|select|from|where|insert|update|delete|join|into|values|and|or|not|in|is';
const HASH_LANGS = /\.(py|rb|sh|bash|zsh|ya?ml|toml|r|pl|ex|exs|cr|nim|conf|ini|env)$|(^|\/)(Dockerfile|Makefile|Gemfile|Procfile)$/i;
function highlight(src, file) {
  const cmt = HASH_LANGS.test(file) ? '#.*' : /\.(sql|lua|hs|elm)$/i.test(file) ? '--.*' : '\\/\\/.*|\\/\\*.*?\\*\\/|<!--.*?-->';
  // keywords are case-sensitive except in SQL, where SELECT and select are the same word
  const re = new RegExp(`(${cmt})|("(?:[^"\\\\\\n]|\\\\.)*"|'(?:[^'\\\\\\n]|\\\\.)*'|\`(?:[^\`\\\\\\n]|\\\\.)*\`)|(\\b\\d+(?:\\.\\d+)?\\b)|\\b(${KW})\\b`, /\.sql$/i.test(file) ? 'gi' : 'g');
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let out = '', i = 0, m;
  while ((m = re.exec(src))) {
    if (!m[0]) { re.lastIndex++; continue; }
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : 'k';
    out += esc(src.slice(i, m.index)) + `<span class="tk-${cls}">${esc(m[0])}</span>`;
    i = m.index + m[0].length;
  }
  return out + esc(src.slice(i));
}
let codeFor = null;
function openCode(o) {
  const c = o.code; if (!c) return;
  stop();
  codeFor = o.id;
  const nm = id => { const n = nodes.get(id); return n && n.label ? n.label : id; };
  $('code-label').textContent = (o.label || (o.type === 'edge' ? `${nm(o.from)} → ${nm(o.to)}` : o.id)).replace(/\n/g, ' ');
  $('code-file').textContent = c.file + (c.start ? `:${c.start}${c.end > c.start ? '-' + c.end : ''}` : '');
  const pm = o.type === 'edge' ? proofMark(o) : null, hitLn = pm && o.proof.status === 'verified' ? o.proof.hit : 0;
  $('code-proof').hidden = !pm;
  if (pm) { $('code-proof').className = 'pm-' + pm[0]; $('code-proof').textContent = (pm[1] === 'check' ? '✓' : pm[1]) + '  ' + pm[2]; }
  const links = $('code-links'); links.innerHTML = '';
  const link = (text, href) => { const a = document.createElement('a'); a.textContent = text; a.href = href; if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; } links.appendChild(a); };
  const ed = EDITORS[S.editor || 'vscode'];
  if (ed && c.abs && location.protocol === 'file:') link(ed[0], ed[1](c.abs, (c.mark && c.mark[0]) || c.start || 1));
  if (c.url) link('GitHub', c.url);
  const body = $('code-body');
  if (c.missing || c.text == null) body.innerHTML = '<div class="missing">The code was not embedded when this page was built.</div>';
  else {
    const mk = c.mark || [];
    body.style.setProperty('--ln0', c.start - 1);
    body.innerHTML = highlight(c.text, c.file).split('\n').map((l, i) => {
      const ln = c.start + i;
      return `<span class="ln${mk.length && ln >= mk[0] && ln <= mk[1] ? ' mark' : ''}${ln === hitLn ? ' hit' : ''}">${l || ' '}</span>`;
    }).join('');
  }
  const panel = $('code');
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
  body.scrollTop = 0;
  const first = body.querySelector('.hit') || body.querySelector('.mark');
  if (first) body.scrollTop = Math.max(0, first.offsetTop - body.clientHeight / 3);
  $('code-close').focus({ preventScroll: true });
}
function closeCode() {
  if (!codeFor) return;
  codeFor = null;
  const panel = $('code'); panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
}
// C opens the code of what the current step is about: its focus, then what it flows, then what it adds.
function stepCodeTarget() {
  const st = steps[cur];
  const ids = [...st.focus, ...st.flow.map(f => f.edge), ...st.added, ...st.activeSet];
  for (const id of ids) {
    const o = all.get(id);
    if (o && o.code && st.visible.has(id)) return o;
    if (o && o.type === 'edge') for (const end of [o.to, o.from]) { const n = nodes.get(end); if (n && n.code && st.visible.has(end)) return n; }
  }
  return null;
}
function drawCodeBadges() {
  const badge = (parent, cx, cy) => {
    const g = el('g', { class: 'code-badge', transform: `translate(${f1(cx)} ${f1(cy)})` }, parent);
    el('circle', { r: 11 }, g);
    el('path', { d: 'M-2.5 -4.5l-4 4.5 4 4.5M2.5 -4.5l4 4.5-4 4.5' }, g);
  };
  nodes.forEach(n => {
    if (!n.code || !n.g || n.kind === 'text') return;
    n.g.classList.add('has-code');
    const b = ISO && n.pill ? n.pill : n.box;
    if (b) badge(n.hg, b.x + b.w - 3, b.y + 3);
  });
  edges.forEach(e => {
    if (!e.code || !e.g) return;
    e.g.classList.add('has-code');
    // with proof on, the label's proof mark already says "there is code behind this"
    if (e.lg) { e.lg.classList.add('has-code'); if (e.lbox && !PROOF) badge(e.lg, e.lbox.x + e.lbox.w + 2, e.lbox.y + e.lbox.h / 2); }
  });
}

/* ---------- theme: light / dark inside the chosen style ---------- */
const THEME_ALIAS = { light: 'light', dark: 'dark', paper: 'light', chalk: 'dark' };
const DARK = matchMedia('(prefers-color-scheme: dark)');
let themeChoice = null;
function resolveTheme() {
  return themeChoice || THEME_ALIAS[qs.get('theme')] || THEME_ALIAS[S.theme] || ST.theme || (DARK.matches ? 'dark' : 'light');
}
function applyTheme() { document.documentElement.dataset.theme = resolveTheme(); }

function wire() {
  $('prev').onclick = () => { stop(); go(cur - 1); };
  $('next').onclick = () => { stop(); go(cur + 1); };
  $('play').onclick = () => playing ? stop() : play();
  $('code-close').onclick = closeCode;
  $('proof').onclick = () => setProofView(!proofView);
  $('diff').onclick = () => setDiffView(diffView === 'before' ? 'after' : 'before');
  $('theme').onclick = () => {
    themeChoice = resolveTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('chalk-talk-theme', themeChoice); } catch (_) {}
    applyTheme();
  };
  DARK.addEventListener('change', applyTheme);
  document.addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k = ev.key;
    if (k === 'Escape') { closeCode(); return; }
    if (k === 'c' || k === 'C') { if (codeFor) closeCode(); else { const o = stepCodeTarget(); if (o) openCode(o); } return; }
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'j') { ev.preventDefault(); stop(); go(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'k') { ev.preventDefault(); stop(); go(cur - 1); }
    else if (k === 'Home') { stop(); go(0); }
    else if (k === 'End') { stop(); go(steps.length - 1); }
    else if (k === 'p' || k === 'P') playing ? stop() : play();
    else if (k === 't' || k === 'T') $('theme').click();
    else if (k === 'v' || k === 'V') setProofView(!proofView);
    else if (k === 'd' || k === 'D') setDiffView(diffView === 'before' ? 'after' : 'before');
    else if (/^[1-9]$/.test(k)) { stop(); go(+k - 1); }
  });
  let down = null;
  board.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; });
  board.addEventListener('pointerup', ev => {
    if (!down) return;
    const dx = ev.clientX - down[0], dy = ev.clientY - down[1]; down = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { stop(); go(cur + (dx < 0 ? 1 : -1)); }
    else if (Math.abs(dx) < 6 && Math.abs(dy) < 6) {
      if (ev.target.closest && ev.target.closest('#hud-diff')) { $('diff').click(); return; }
      // a tap on something with code opens it; with the panel open, a tap on the board closes it
      const hitEl = ev.target.closest && ev.target.closest('.has-code[data-id]'), o = hitEl && all.get(hitEl.dataset.id);
      if (o && o.code && !hitEl.classList.contains('off')) { o.id === codeFor ? closeCode() : openCode(o); return; }
      if (codeFor) { closeCode(); return; }
      stop(); go(cur + (ev.shiftKey ? -1 : 1));
    }
  });
  addEventListener('hashchange', () => { const k = parseInt(location.hash.slice(1), 10) - 1; if (k >= 0 && k !== cur) { stop(); go(k, { keepHash: true }); } });
  PORTRAIT.addEventListener('change', () => { if (cur >= 0) { framed = false; frame(steps[cur]); } });
}

/* ---------- report ---------- */
function publishReport() {
  report.ok = !report.issues.some(i => i.level === 'error');
  report.style = STYLE_NAME;
  let node = document.getElementById('chalk-report');
  if (!node) { node = document.createElement('script'); node.type = 'application/json'; node.id = 'chalk-report'; document.body.appendChild(node); }
  node.textContent = JSON.stringify(report).replace(/</g, '\\u003c');   // keeps the serialized DOM parseable
  report.issues.forEach(i => (i.level === 'error' ? console.error : console.warn)(`[chalk-talk] ${i.where}: ${i.msg}`));
  // steps are numbered from 1 here, like the page's #hash and chalk.go
  Object.assign(window.chalk, { report, style: STYLE_NAME, steps: () => steps.length, go: k => go(k - 1, { instant: true }), seek, duration });
}

/* ---------- views: proof (V) and before / after (D) ---------- */
function setProofView(on) {
  if (!PROOF) return;
  proofView = on;
  document.documentElement.classList.toggle('proof-view', on);
  $('proof').setAttribute('aria-pressed', String(on));
  if (cur >= 0) updateBar();
}
function setDiffView(v) {
  if (!CHANGE) return;
  diffView = v;
  document.documentElement.classList.toggle('diff-before', v === 'before');
  $('diff').setAttribute('aria-pressed', String(v === 'before'));
  drawHud();
  if (cur >= 0) go(cur, { instant: true, keepHash: true });
}

/* ---------- deterministic time, for recorders ----------
   seek(k, ms) draws step k exactly as it looks ms after it starts (entered from step k-1, the way
   "next" plays it): every WAAPI animation is paused at that time, packets are placed from the same
   clock, and the camera and dimming moves, CSS transitions in the live page, become animations
   too. The first call stops playback and leaves the page in this frozen recording mode. */
let seekMode = false, seekK = -1;
function seekEnter(k) {
  if (!seekMode) {
    seekMode = true; ANIM = true; stop(); closeCode();
    document.documentElement.classList.add('seeking');
    document.getAnimations().forEach(a => a.cancel());
  }
  let cam0 = 'none';
  const op0 = new Map();
  if (k > 0) {   // where the previous step left the camera and the dimming
    enter(k - 1, false);
    cam0 = L.world.style.transform || 'none';
    board.querySelectorAll('#world .el').forEach(g => { if (!g.classList.contains('off')) op0.set(g, getComputedStyle(g).opacity); });
  }
  cur = k;
  enter(k, true);
  updateBar();
  if (k > 0) {
    const cam1 = L.world.style.transform || 'none';
    if (cam1 !== cam0) running.push(L.world.animate([{ transform: cam0 }, { transform: cam1 }], { duration: 950, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'backwards' }));
    op0.forEach((o, g) => {
      const o1 = getComputedStyle(g).opacity;
      if (!g.classList.contains('off') && o1 !== o) running.push(g.animate([{ opacity: o }, { opacity: o1 }], { duration: 450, easing: 'ease', fill: 'backwards' }));
    });
  }
  const seen = new Map();
  flowItems.forEach(it => {
    running.push(...fxDepart(nodes.get(it.reverse ? it.e.to : it.e.from), flowDelay + it.start, seen));
    running.push(...fxArrive(nodes.get(it.reverse ? it.e.from : it.e.to), flowDelay + it.start + it.dur, seen));
  });
  seekK = k;
}
function seek(k, ms = 0) {
  k = clamp(Math.round(k) - 1, 0, steps.length - 1);
  if (k !== seekK || !seekMode) seekEnter(k);
  ms = Math.max(0, +ms || 0);
  running.forEach(a => { a.pause(); a.currentTime = ms; });
  if (flowAt) flowAt(ms - flowDelay, false);
}
// ms until step k has finished moving: entrances, notes, focus, camera and one pass of its packets
function duration(k) {
  seek(k, 0);
  let end = flowItems.length ? flowDelay + flowSpan : 0;
  running.forEach(a => { const t = a.effect.getComputedTiming().endTime; if (isFinite(t)) end = Math.max(end, t); });
  return Math.ceil(end);
}
function fatal(msg) {
  document.body.innerHTML = '';
  const pre = document.createElement('pre'); pre.className = 'fatal'; pre.textContent = '[chalk-talk] ' + msg; document.body.appendChild(pre);
  const node = document.createElement('script'); node.type = 'application/json'; node.id = 'chalk-report';
  node.textContent = JSON.stringify({ ok: false, steps: 0, issues: [{ level: 'error', where: 'scene', msg }] }); document.body.appendChild(node);
  document.documentElement.dataset.chalk = 'ready';
  if (readyResolve) readyResolve(window.chalk);
}

/* ---------- boot ---------- */
async function boot() {
  if (S.title) { document.title = S.title; $('sr-title').textContent = S.title + (S.subtitle ? ' - ' + S.subtitle : ''); }
  document.documentElement.lang = LANG;
  if (!ANIM) document.documentElement.classList.add('still');
  if (!SNAP) { try { const saved = localStorage.getItem('chalk-talk-theme'); if (saved === 'light' || saved === 'dark') themeChoice = saved; } catch (_) {} }
  if (qs.get('theme')) themeChoice = THEME_ALIAS[qs.get('theme')] || null;
  applyTheme();
  if (S.title) { $('mtitle').textContent = S.title; if (S.subtitle) { const sm = document.createElement('small'); sm.textContent = S.subtitle; $('mtitle').appendChild(sm); } }
  readMetrics();
  // measure text only once the fonts are in, or the layout drifts
  const sample = JSON.stringify(S).slice(0, 4000);
  const loaded = Promise.all(ROLES.map(r => document.fonts.load(fontOf(r), sample).catch(() => null)));
  let timedOut = false;
  await Promise.race([loaded, new Promise(r => setTimeout(() => { timedOut = true; r(); }, 3500))]);
  if (timedOut) issue('warn', 'fonts', 'fonts did not load in time (offline?); fallback fonts used');
  computeTitleBox();
  layout();
  draw();
  buildBar();
  publishReport();
  const fromHash = parseInt(location.hash.slice(1), 10) - 1;
  const start = fromHash >= 0 && fromHash < steps.length ? fromHash : 0;
  if (ANIM && start === 0) L.title.querySelectorAll('text').forEach((t, i) => fade(t, i * 120, 520, 4));
  cur = start - 1;
  L.world.style.transition = 'none';                // the first frame is placed, not flown to
  go(start, { instant: start !== 0 || !ANIM, keepHash: true });
  requestAnimationFrame(() => requestAnimationFrame(() => { L.world.style.transition = ''; }));
  $('proof').hidden = !PROOF; $('diff').hidden = !CHANGE;
  if (qs.has('proof')) setProofView(true);            // ?proof opens in proof view, ?diff=before in the before view
  if (qs.get('diff') === 'before') setDiffView('before');
  wire();
  if (qs.has('play') && ANIM) play();
  document.documentElement.dataset.chalk = 'ready';
  readyResolve(window.chalk);
  if (timedOut) loaded.then(() => { readMetrics(); computeTitleBox(); layout(); draw(); const k = cur; cur = -1; go(k, { instant: true, keepHash: true }); });
}
boot();
})();
</script>
