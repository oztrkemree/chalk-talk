    sides.forEach(({ n, side }) => { if (!used.has(n.id)) used.set(n.id, new Set()); used.get(n.id).add(side); });
    const offsOf = (n, side) => [...sides.values()].filter(v => v.n === n && v.side === side).flatMap(v => v.list.map(e => e.pl[e.end]));
    const boxes = [];   // obstacles for flow labels: {x0,y0,x1,y1}
    nodes.forEach(n => {
      const u = used.get(n.id) || new Set(), half = Z.S / 2;
      if (n.group) {   // the name tab sits on the top border, or the bottom one when flows come in from above
        n.tabBottom = u.has('N') && !u.has('S');
        n.box = { x0: n.x - n.bw / 2, y0: n.y - n.bh / 2 - Z.tab * 0.75, x1: n.x + n.bw / 2, y1: n.y + n.bh / 2 + Z.tab * 0.75 };
        boxes.push(n.box);
        return;
      }
      Object.assign(n, labelOf(n, u, offsOf));
      n.box = { x0: n.x - half, y0: n.y - half, x1: n.x + half, y1: n.y + half };
      boxes.push(n.box, n.lbox);
    });
    plans.forEach(pl => nodes.forEach(n => {
      if (n.lbox && segsOf(pl).some(s => ov(segBox(s, 2), n.lbox) > 0)) ctx.issue('warn', `flow ${pl.f.from} → ${pl.f.to} crosses the label of "${n.id}"; move one of them on the grid`);
    }));

    /* ---- flow labels + value pills: first spot along the route that hits nothing ---- */
    const lines = plans.map(pl => segsOf(pl).map(s => ({ pl, box: segBox(s, pl.sw / 2 + 4) })));
    const placed = [];
    const markR = Z.mark;
    plans.forEach(pl => {
      const f = pl.f, label = f.label != null && f.label !== '' ? String(f.label) : '', value = f.value != null && f.value !== '' ? String(f.value) : '';
      const proof = proofOf(f);
      if (!label && !value && !proof) return;
      const pw = value ? ctx.measure(value, FN.pill) + Z.pill * 1.15 : 0, ph = value ? Z.pill * 1.7 : 0;
      const segs = segsOf(pl), lens = segs.map(s => Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1])), maxLen = Math.max(...lens);
      const longWord = label ? Math.max(...ctx.plain(label).split(/\s+/).map(x => ctx.measure(x, FN.lab))) + 2 : 0;
      let best = null;
      segs.forEach((s, si) => {
        const len = lens[si], horiz = Math.abs(s.a[1] - s.b[1]) < 0.5;
        if (len < 40) return;
        // room for the label: the run's length (horizontal) or the gap beside it, never narrower than its longest word
        const tw0 = clamp(Math.max(horiz ? len - 40 : (tall ? 230 : 250) * Z.u, longWord), 150 * Z.u, 320 * Z.u);
        const T = label ? est(ctx, label, FN.lab, tw0, 2) : { w: 0, h: 0 };
        const mw = proof ? markR * 2 + 8 : 0;
        for (const tt of [0.5, 0.36, 0.64, 0.22, 0.78]) {
          const P = [s.a[0] + (s.b[0] - s.a[0]) * tt, s.a[1] + (s.b[1] - s.a[1]) * tt];
          // on a vertical line a wide pill would cover a parallel neighbour, so it may also sit beside the line
          for (const [side, beside] of [[0, false], [1, false], ...(!horiz && value ? [[0, true], [1, true]] : [])]) {
            const c = { si, tt, side, P, horiz, maxW: tw0, T, mw, pw, ph };
            const parts = [];
            const pdx = beside ? (side ? -1 : 1) * (pl.sw / 2 + 12 + pw / 2) : 0;
            if (value) parts.push(c.pill = { x0: P[0] + pdx - pw / 2, y0: P[1] - ph / 2, x1: P[0] + pdx + pw / 2, y1: P[1] + ph / 2 });
            if (label || proof) {
              const tw = T.w + mw, th = Math.max(T.h, proof ? markR * 2 : 0);
              if (horiz) {
                const off = (value ? ph / 2 : pl.sw / 2) + 8;
                c.text = side ? { x0: P[0] - tw / 2, y0: P[1] + off, x1: P[0] + tw / 2, y1: P[1] + off + th } : { x0: P[0] - tw / 2, y0: P[1] - off - th, x1: P[0] + tw / 2, y1: P[1] - off };
              } else {
                const off = (value ? (beside ? pl.sw / 2 + 12 + pw + 10 : pw / 2 + 14) : pl.sw / 2 + 14);
                c.text = side ? { x0: P[0] - off - tw, y0: P[1] - th / 2, x1: P[0] - off, y1: P[1] + th / 2 } : { x0: P[0] + off, y0: P[1] - th / 2, x1: P[0] + off + tw, y1: P[1] + th / 2 };
              }
              parts.push(c.text);
            }
            // value pill must sit on the straight part of its segment
            let score = (1 - len / maxLen) * 30 + Math.abs(tt - 0.5) * 40 + side * 4 + (beside ? 12 : 0);
            if (value && Math.min(tt, 1 - tt) * len < (horiz ? pw : ph) / 2 + Z.r) score += 400;
            for (const p of parts) {
              for (const b of boxes) score += ov(p, b);
              for (const q of placed) score += ov(p, q) * 2;
              lines.forEach((ls, li) => ls.forEach(l => { if (plans[li] !== pl || p === c.text) score += ov(p, l.box) * (plans[li] === pl ? 0.6 : 1.5); }));
              score += Math.max(0, A.x0 - 40 - p.x0, p.x1 - A.x1 - 40, A.y0 - 20 - p.y0, p.y1 - A.y1 - 20) * 8;
            }
            c.score = score;
            if (!best || score < best.score) best = c;
          }
        }
      });
      if (!best) return;
      pl.lab = Object.assign(best, { label, value, proof });
      if (best.pill) placed.push(best.pill);
      if (best.text) placed.push(best.text);
      if (best.score > 600) ctx.issue('warn', `flow ${f.from} → ${f.to}: no clear spot for its label; it overlaps something`);
    });

    /* ---- camera: the layout is the union (stable), the framing fits what this frame shows ---- */
    // what is on screen in Cx for the given states: actors + their labels, flow lines + their labels
    // With frame index k: when that frame fades many actors (focus), frame only its new part (+ focus) and the
    // actors joined to it; older faded parts may crop at the stage edges (bb.crop)
    const frameBox = (Cx, sts, k) => {
      const bb = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity, crop: false };
      const grow = b => { if (!b) return; bb.x0 = Math.min(bb.x0, b.x0); bb.y0 = Math.min(bb.y0, b.y0); bb.x1 = Math.max(bb.x1, b.x1); bb.y1 = Math.max(bb.y1, b.y1); };
      const fl = Cx.flows.filter(x => sts.some(st => vF(Cx, x, st))), keys = new Set(fl.map(x => x.key));
      const vis = [...nodes.keys()].filter(id => sts.some(st => vA(Cx, id, st)));
      const fo = k == null ? new Set() : new Set(arr(F[k].focus).map(String).filter(id => nodes.has(id)));
      let keep = null;
      if (fo.size && vis.filter(id => !fo.has(id)).length >= 3) {
        const core = new Set([...fo, ...vis.filter(id => Cx.actors.get(id)._k === k)]);
        fl.forEach(x => { if (x._k === k) { core.add(x.from); core.add(x.to); } });
        keep = new Set(core);
        fl.forEach(x => { if (core.has(x.from)) keep.add(x.to); if (core.has(x.to)) keep.add(x.from); });
        bb.crop = keep.size < vis.length;
      }
      const kept = id => !keep || keep.has(id);
      nodes.forEach(n => { if (vis.includes(n.id) && kept(n.id)) { grow(n.box); grow(n.lbox); } });
      plans.forEach((pl, i) => {
        if (keys.has(pl.f.key) && kept(pl.f.from) && kept(pl.f.to)) { lines[i].forEach(l => grow(l.box)); if (pl.lab) { grow(pl.lab.pill); grow(pl.lab.text); } }
      });
      return isFinite(bb.x0) ? bb : null;
    };
    // fit + centre; inside a continue chain the camera may come closer (type up to ~1.6× its base size)
    const cap = group.length > 1 ? 1.6 / Z.u : 1.12;
    const cam = bb => {
      const s = Math.min(cap, (A.x1 - A.x0) / (bb.x1 - bb.x0), (A.y1 - A.y0) / (bb.y1 - bb.y0));
      return { bb, s, tx: (A.x0 + A.x1) / 2 - s * (bb.x0 + bb.x1) / 2, ty: (A.y0 + A.y1) / 2 - s * (bb.y0 + bb.y1) / 2 };
    };
    const both = ['after', 'before'];
    const sts0 = frame.compare ? both : [state];
    const K = cam(frameBox(C, sts0, ctx.index) || frameBox(U, both));
    const { bb, s, tx, ty } = K;
    if (s < 0.84) ctx.issue('warn', `diagram is crowded (scaled to ${Math.round(s * 100)}%); use fewer actors or shorter labels`);
    const defs = ctx.el('defs', {}, ctx.stage);
    let host = ctx.stage;
    if (bb.crop) {   // a window below the legend; the faded parts cut off fade out at the sides they leave by
      const H = ctx.H, top = Math.max(0, ty + s * bb.y0 - (tall ? 22 : 18)), fb = frameBox(C, sts0);
      const o = { x0: tx + s * fb.x0, y0: ty + s * fb.y0, x1: tx + s * fb.x1, y1: ty + s * fb.y1 }, e = 26, far = 400;
      host = ctx.el('svg', { x: 0, y: r1(top), width: W, height: r1(H - top), viewBox: `0 ${r1(top)} ${W} ${r1(H - top)}`, overflow: 'hidden', 'data-crop': 1 }, ctx.stage);
      const fid = ctx.id('flow-cropf'), mid = ctx.id('flow-crop');
      ctx.el('feGaussianBlur', { stdDeviation: 12 }, ctx.el('filter', { id: fid, x: -far, y: -far, width: W + 2 * far, height: H + 2 * far, filterUnits: 'userSpaceOnUse' }, defs));
      const m = ctx.el('mask', { id: mid, maskUnits: 'userSpaceOnUse', x: -far, y: -far, width: W + 2 * far, height: H + 2 * far }, defs);
      const x0 = o.x0 < 0 ? e : -far, x1 = o.x1 > W ? W - e : W + far, y0 = o.y0 < top ? top + e : -far, y1 = o.y1 > H ? H - e : H + far;
      ctx.el('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: '#fff', filter: `url(#${fid})` }, m);
      host = ctx.el('g', { mask: `url(#${mid})` }, host);
    }
    const root = ctx.el('g', { class: 'flow', transform: `translate(${r1(tx)} ${r1(ty)})${s !== 1 ? ` scale(${s.toFixed(4)})` : ''}` }, host);
    const gLines = ctx.el('g', {}, root), gActors = ctx.el('g', {}, root), gLabels = ctx.el('g', {}, root);
    leg.place(tx + s * bb.x0, tx + s * bb.x1, ty + s * bb.y0);
    // a continue frame starts at the previous frame's framing and glides to this one (seekable; ends natural)
    let camMs = 0;
    if (chain.length > 1 && !toggle) {
      const pk = chain[chain.length - 2], pb = frameBox(collect(ctx, F, chain.slice(0, -1), false), F[pk].compare ? both : ['after'], pk);
      const P = pb && cam(pb), k = P ? P.s / s : 1;
      if (P && (Math.abs(k - 1) > 0.004 || Math.hypot(P.tx - tx, P.ty - ty) > 1)) {
        camMs = 1000;
        const a = ctx.anim(root, [{ transform: `translate(${r1(P.tx - k * tx)}px,${r1(P.ty - k * ty)}px) scale(${k.toFixed(4)})` }, { transform: 'translate(0px,0px) scale(1)' }],
          { at: 0, duration: camMs, easing: 'cubic-bezier(.6,0,.25,1)' });
        // the move is in stage units about the stage origin, like the root's own transform attribute
        if (a && a.effect && a.effect.target) Object.assign(a.effect.target.style, { transformBox: 'view-box', transformOrigin: '0px 0px' });
      }
    }

    /* ---- focus ---- */
    const focus = new Set(arr(frame.focus).map(String).filter(id => { if (!nodes.has(id)) ctx.issue('warn', `focus "${id}" is not an actor`); return nodes.has(id); }));
    const opA = id => (focus.size && !focus.has(id) ? 0.22 : 1);
    const opF = f => (!focus.size ? 1 : focus.size === 1 ? (focus.has(f.from) || focus.has(f.to) ? 1 : 0.22) : (focus.has(f.from) && focus.has(f.to) ? 1 : 0.22));

    /* ---- draw + motion ---- */
    const halo = (o, size) => { o.el.setAttribute('stroke', t.paper); o.el.setAttribute('stroke-width', r1(size * 0.32)); o.el.setAttribute('stroke-linejoin', 'round'); o.el.setAttribute('paint-order', 'stroke'); return o; };
    const enterA = [], leaveEls = [];
    nodes.forEach(n => {
      const a = C.actors.get(n.id);
      const m = a ? mode(a, (x, st) => visA(x.id, st)) : null;
      if (!m) return;
      const g = ctx.el('g', { class: 'flow-actor' }, gActors);
      if (a.code) ctx.el('title', {}, g).textContent = codeRef(a.code);
      const parts = n.group ? drawGroup(ctx, g, n, Z, FN) : drawActor(ctx, g, n, a, Z, FN, halo);
      const op = opA(n.id);
      if (m === 'leave') { g.setAttribute('opacity', 0); leaveEls.push([g, op]); }
      else if (m === 'enter') enterA.push({ n, g, op, parts });
      else if (op < 1) g.setAttribute('opacity', op);
    });

    const enterF = [];
    plans.forEach(pl => {
      const x = C.flows.find(c => c.key === pl.f.key);
      const m = x ? mode(x, visF) : null;
      if (!m) return;
      // out of focus = faded ink (not opacity), so value pills still cover the line under them
      const accent = accentOf(x), op = opF(x), dim = op < 1 ? c => mix(c, t.paper, 0.72) : c => c, color = dim(accent ? t.accent : t.ink);
      const ln = drawLine(ctx, gLines, pl.pts, x.type, color, Z);
      const lab = pl.lab ? drawLabel(ctx, gLabels, pl, x, color, accent, Z, FN, markR, w, halo, dim) : null;
      const els = [ln.g, lab && lab.g].filter(Boolean);
      if (m === 'leave') els.forEach(e => { e.setAttribute('opacity', 0); leaveEls.push([e, 1]); });
      else if (m === 'enter') enterF.push({ pl, ln, lab, accent });
    });

    // motion: leave first (toggle), then actors in reading order, then flows one by one, accent last
    leaveEls.forEach(([e, op]) => ctx.anim(e, [{ opacity: op }, { opacity: 0 }], { at: 0, duration: 420, easing: 'ease-in' }));
    const base = (toggle ? 260 : 120) + camMs * 0.5, stepA = toggle ? 90 : 110;
    enterA.sort((p, q) => (tall ? p.n.y - q.n.y || p.n.x - q.n.x : p.n.x - q.n.x || p.n.y - q.n.y));
    enterA.forEach(({ n, g, op, parts }, k) => {
      const at = base + k * stepA;
      if (n.group) {
        ctx.beat(parts.box, 'draw', { at, dur: 900 });
        ctx.beat(parts.tab, 'fade', { at: at + 300, dy: 0 });
        parts.members.forEach((e, j) => ctx.beat(e, 'pop', { at: at + 260 + j * 90 }));
        if (op < 1) g.setAttribute('opacity', op);
      } else ctx.beat(g, 'fade', { at, dur: 600, dy: 10, to: op < 1 ? op : null });
    });
    let tf = enterA.length ? base + (enterA.length - 1) * stepA + (toggle ? 380 : 520) : (toggle ? 420 : 200) + camMs * 0.6;
    const order = enterF.filter(e => !e.accent).concat(enterF.filter(e => e.accent));
    const stagger = clamp(3200 / Math.max(1, order.length), 380, 640);
    order.forEach((e, k) => {
      if (e.accent && k > 0 && !order[k - 1].accent) tf += 300;   // a beat of quiet before the new thing
      const dur = clamp(e.ln.len * 0.8, 520, 1150);
      animateFlow(ctx, defs, e, tf, dur);
      tf += e.accent ? Math.max(stagger, dur * 0.7) : stagger;
    });
    if (!toggle && !C.inherited) ctx.beat(leg.g, 'fade', { at: 60, dy: 0 });
  }

  /* ---------- data ---------- */

  // frames that make up this diagram: chain = base … this frame; group = base … last frame that continues it
  function chainOf(ctx, F) {
    const isFlow = f => f && f.lens === 'flow';
    const chain = [ctx.index];
    while (F[chain[0]].continue) {
      let k = chain[0] - 1;
      while (k >= 0 && !isFlow(F[k])) k--;
      if (k < 0) { ctx.issue('warn', '"continue": true but there is no earlier flow frame'); break; }
      chain.unshift(k);
    }
    const group = chain.slice();
    for (let k = ctx.index + 1; k < F.length; k++) { if (!isFlow(F[k])) continue; if (!F[k].continue) break; group.push(k); }
    return { chain, group };
  }

  function collect(ctx, F, idxs, report) {
    const actors = new Map(), flows = new Map();
    const say = (msg) => { if (report) ctx.issue('warn', msg); };
    for (const k of idxs) {
      const f = F[k];
      for (const a of arr(f.actors)) {
        if (!a || a.id == null) { say('actor without an "id"'); continue; }
        const id = String(a.id), old = actors.get(id);
        actors.set(id, Object.assign({}, old, a, { id, _k: old ? old._k : k }));
      }
      for (const x of arr(f.flows)) {
        if (!x || x.from == null || x.to == null) { say('flow needs "from" and "to"'); continue; }
        const key = x.id != null ? 'id:' + x.id : `${x.from}>${x.to}|${x.type || ''}|${ctx.plain(String(x.label || ''))}`;
        const old = flows.get(key);
        flows.set(key, Object.assign({}, old, x, { key, from: String(x.from), to: String(x.to), _k: old ? old._k : k, _newAt: x.new ? k : undefined }));
      }
    }
    for (const x of flows.values()) {
      if (!STYLE[x.type]) { if (x.type != null) say(`unknown flow type "${x.type}" (${TYPES.join(' | ')}); drawn as info`); x.type = 'info'; }
      for (const e of ['from', 'to']) if (!actors.has(x[e])) say(`flow ${e} "${x[e]}" is not an actor`);
      if (x.from === x.to) say(`flow ${x.from} → ${x.to} points at itself; skipped`);
    }
    return { actors, flows: [...flows.values()], inherited: idxs.length > 1 };
  }

  function placeCells(ctx, actors) {
    const cells = new Map(), taken = new Set(), list = [...actors.values()];
    const ok = a => Array.isArray(a.at) && a.at.length === 2 && a.at.every(Number.isFinite);
    list.filter(ok).forEach(a => { const c = [Math.round(a.at[0]), Math.round(a.at[1])]; cells.set(a.id, c); taken.add(c.join(',')); });
    const rest = list.filter(a => !ok(a));
    if (rest.length && !cells.size) {   // nobody placed: one calm row (or a few)
      const rows = Math.ceil(rest.length / 4), per = Math.ceil(rest.length / rows);
      rest.forEach((a, k) => cells.set(a.id, [k % per, Math.floor(k / per)]));
    } else {
      for (const a of rest) {
        let spot = null;
        for (let r = 0; r < 3 && !spot; r++) for (let c = 0; c < 4 && !spot; c++) if (!taken.has(c + ',' + r)) spot = [c, r];
        if (!spot) { spot = [taken.size % 4, 3]; ctx.issue('warn', `no free grid cell for actor "${a.id}"`); }
        taken.add(spot.join(',')); cells.set(a.id, spot);
      }
    }
    return cells;
  }

  function membersOf(ctx, a) {
    const cast = ctx.story.cast || [];
    return arr(a.members).map(m => (typeof m === 'string' ? ((cast.find(c => c.id === m) || {}).name || m) : m && (m.name || m.id) ? String(m.name || m.id) : '?'));
  }

  function proofOf(f) {
    if (f.proof && f.proof.status) return f.proof;
    if (typeof f.inferred === 'string' && f.inferred.trim()) return { status: 'inferred', why: f.inferred };   // dev page, no build
    return null;
  }
  const codeRef = c => (typeof c === 'string' ? c : c && c.file ? c.file + (c.start ? `:${c.start}-${c.end}` : '') : '');

  // greedy wrap estimate with the same fonts core uses (layout runs before anything is drawn)
  function est(ctx, str, o, maxW, maxLines) {
    const words = ctx.plain(String(str == null ? '' : str)).split(/\s+/).filter(Boolean);
    if (!words.length) return { w: 0, h: 0, n: 0 };
    const m = x => ctx.measure(x, o), out = [];
    let cur = '';
    for (const wd of words) { const t2 = cur ? cur + ' ' + wd : wd; if (cur && m(t2) > maxW) { out.push(cur); cur = wd; } else cur = t2; }
    out.push(cur);
    const n = Math.min(out.length, maxLines);
    return { w: Math.min(maxW, Math.max(...out.slice(0, n).map(m))), h: n * o.size * o.lh, n };
  }

  function groupGeom(ctx, a, mem, Z, ms = 1) {
    const n = mem.length, slots = Math.min(n, 6), show = n > 6 ? 5 : n;
    const cols = slots <= 3 ? slots : slots === 4 ? 2 : 3, rows = Math.ceil(slots / cols);
    const memS = Z.memS * ms, memF = Z.mem * Math.min(ms, 1.2), cw = Z.cw * ms, chh = memS + memF * 1.1 + 30 * Z.u;
    const tabStr = String((a.label || a.id) + (a.sub ? ' · ' + a.sub : '')).toLocaleUpperCase(ctx.lang);
    const tabW = ctx.measure(tabStr, { font: 'mono', size: Z.tab, weight: 500, ls: 0.12 });
    const top = Z.tab * 0.6 + 34 * Z.u, bottom = 22 * Z.u;
    const bw = Math.max(cols * cw + 52 * Z.u, tabW + 90 * Z.u), bh = rows * chh + top + bottom;
    return { group: true, memS, memF, cols, rows, cw, chh, bw, bh, top, tabStr, tabW, show, more: n - show, fw: bw, fh: bh + Z.tab };
  }

  /* ---------- drawing ---------- */

  function picto(ctx, parent, kind, cx, cy, size) {
    const src = PICTO[kind];
    if (!src) return ctx.icon(parent, kind || 'person', cx, cy, size, { sw: 3 });   // core icon set; warns if unknown
    const g = ctx.el('g', { transform: `translate(${r1(cx - size / 2)} ${r1(cy - size / 2)}) scale(${(size / 48).toFixed(4)})` }, parent);
    g.innerHTML = src.replace(/="K"/g, `="${ctx.t.ink}"`).replace(/="P"/g, `="${ctx.t.paper}"`);
    return ctx.rough(g, 1);
  }

  function drawActor(ctx, g, n, a, Z, FN, halo) {
    const kind = PICTO[a.kind] || CORE_ICONS.has(a.kind) ? a.kind : 'person';
    if (a.kind != null && kind !== a.kind) ctx.issue('warn', `unknown actor kind "${a.kind}"; drawn as person`);
    picto(ctx, g, kind, n.x, n.y, Z.S);
    const name = a.label != null ? a.label : a.id, b = n.lbox, anchor = n.anchor, x = n.lx;
    const nm = halo(ctx.rich(g, name, x, b.y0, Object.assign({}, FN.name, { anchor, maxW: n.maxW, lines: 2, minSize: FN.name.size * 0.8 })), Z.name);

  function drawGroup(ctx, g, n, Z, FN) {
    const t = ctx.t, x0 = n.x - n.bw / 2, y0 = n.y - n.bh / 2;

  // orthogonal polyline with rounded corners; with `rnd`, each straight run bows a hair (seeded), the
  // hand-drawn line without the wobble filter (which breaks thin and dashed strokes)
  function roundPath(pts, r, rnd) {
    let d = `M${pts[0][0]} ${pts[0][1]}`, cur = pts[0];
    const run = (x, y) => {
      const len = Math.hypot(x - cur[0], y - cur[1]);

        const j = (rnd() - 0.5) * 2 * Math.min(2.4, len * 0.008), nx = -(y - cur[1]) / len, ny = (x - cur[0]) / len;

      } else d += ` L${r1(x)} ${r1(y)}`;
      cur = [x, y];
    };
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, l1 / 2, l2 / 2);

      d += ` Q${x1} ${y1} ${r1(e[0])} ${r1(e[1])}`;
      cur = e;
    }
    const p = pts[pts.length - 1];
    run(p[0], p[1]);
    return d;
  }

  // one typed line: body (masked so it can be drawn on), head, optional tail dot
  function drawLine(ctx, parent, pts, type, color, Z, opt = {}) {
    const st = STYLE[type], k = Z.k, sw = st.w * k, hl = st.hl * k, hw = st.hw * k, t = ctx.t;
    const n = pts.length, tip = pts[n - 1], prev = pts[n - 2];
    const L0 = Math.hypot(tip[0] - prev[0], tip[1] - prev[1]) || 1, dir = [(tip[0] - prev[0]) / L0, (tip[1] - prev[1]) / L0];
    const trim = Math.min(L0 * 0.6, st.head === 'open' ? sw * 0.5 : hl * 0.85);
    const body = pts.map(p => p.slice());
    body[n - 1] = [tip[0] - dir[0] * trim, tip[1] - dir[1] * trim];
    const d = roundPath(body, opt.r != null ? opt.r : Z.r, opt.flat ? null : ctx.rand('flow-' + type + pts.flat().join(',')));
    const g = ctx.el('g', { class: 'flow-line flow-' + type }, parent);

      : ctx.el('path', { d: `M${T}L${P1}L${P2}Z`, fill: st.head === 'hollow' ? t.paper : color, stroke: color, 'stroke-width': r1((st.head === 'hollow' ? 3 : 1.4) * k), 'stroke-linejoin': 'round' }, g);

  }

  function drawLabel(ctx, parent, pl, x, color, accent, Z, FN, R, w, halo, dim) {
    const L = pl.lab, t = ctx.t, g = ctx.el('g', { class: 'flow-label' }, parent);

  // tiny proof mark, chalk-talk 0.2 rules: ✓ ok (verified, cited), ? warn (inferred, unproven), ! error (broken)
  function proofMark(ctx, parent, proof, cx, cy, R, w, dim) {

  // draw along the route; the value pill rides the line to its spot; head, label and mark land after
  function animateFlow(ctx, defs, e, at, dur) {

    if (lab.mark) ctx.beat(lab.mark, 'pop', { at: at + dur + 160, dur: 420 });

      const cut = i => (2 - Math.PI / 2) * Math.min(ln.r, segs[i - 1] / 2, segs[i] / 2);   // a rounded corner is shorter
      const total = mp.getTotalLength() || ln.len;
      let acc = 0;
      const kf = [{ offset: 0, opacity: 0, transform: `translate(${r1(pts[0][0] - P[0])}px,${r1(pts[0][1] - P[1])}px)` }];
      for (let i = 1; i <= L.si; i++) { acc += segs[i - 1] - cut(i); kf.push({ offset: Math.min(1, acc / total), opacity: 1, transform: `translate(${r1(pts[i][0] - P[0])}px,${r1(pts[i][1] - P[1])}px)` }); }
      const rest = Math.min(total, acc + Math.hypot(P[0] - pts[L.si][0], P[1] - pts[L.si][1]));
      kf.push({ offset: rest / total, opacity: 1, transform: 'translate(0px,0px)' }, { offset: 1, opacity: 1, transform: 'translate(0px,0px)' });

      if (fadeIn > 0) kf.splice(1, 0, { offset: fadeIn, opacity: 1, transform: lerpT(kf[0], kf[1], fadeIn) });

  }
  function lerpT(k0, k1, off) {
    const p = s => s.transform.match(/-?[\d.]+/g).map(Number), a = p(k0), b = p(k1), u = (off - k0.offset) / (k1.offset - k0.offset);

  }

  // the key: one short sample line per type on screen, plus "accent = new"
  function legend(ctx, types, hasNew, w, Z, tall, stamp) {
    const g = ctx.el('g', { class: 'flow-legend' }, ctx.stage);

    if (hasNew) items.push({ ty: 'new', label: w.new });

    const maxX = ctx.W - M - (stamp ? (tall ? 250 : 300) : 0);

    const f = { font: 'sans', size: Z.leg, weight: 400 }, rows = [];

      if (!row) rows.push(row = { g: ctx.el('g', {}, g), w: 0 });
      if (it.ty === 'new') ctx.el('path', { d: `M${x} ${y}H${x + sw}`, stroke: ctx.t.accent, 'stroke-width': 4.6 * Z.k, 'stroke-linecap': 'round', fill: 'none' }, row.g);
      else drawLine(ctx, row.g, [[x, y], [x + sw, y]], it.ty, ctx.t.ink, Z, { r: 0, flat: true });   // the key stays crisp
      ctx.text(row.g, it.label, x + sw + gap, y, Object.assign({}, f, { valign: 'middle', color: it.ty === 'new' ? 'accent' : 'ink2', lh: 1, lines: 1 }));

      x += need + sp;
    }

    const place = (d0, d1, top) => {
      const dy = Math.max(0, top - (tall ? 30 : 26) - bottom);
      rows.forEach(r => {
        const x0 = clamp(stamp ? d0 : d1 - r.w, M, ctx.W - M - r.w);
        r.g.setAttribute('transform', `translate(${r1(x0 - M)} ${r1(dy)})`);

    return { g, bottom, place };
  }
})();

/* chalk-talk frames · lens-card: number, whatif, compare, screen, timeline
 *
 * The editorial lenses (Dan Roam's "how much", "what if", "why / what changes", "what it looks like", "when").
 * Fields (SPEC.md):
 *  number   big ("1.240 ₺", "%31", "3,1 milyon"), label, sub, who (cast id → small head byline),
 *           viz { kind: bars | dots | line | donut | icons, data: [{ label, value, accent }], unit, format, icon }
 *  whatif   headline, vars [{ id, label, min, max, step, value, unit }], outputs [{ label, expr, format, accent }],
 *           viz (as number, but data items may carry `expr` instead of `value`; redrawn live)
 *  compare  left / right { label, tone: muted | accent, lines (≤3), art: icon name | { icon } | { people, props } },
 *           or before / after { label, lines, people, props } (drawn as muted / accent sides)
 *  screen   device: phone | laptop, ui [{ type, text, items, label, value, sub, accent }], annotate [{ at, text }]
 *  timeline items [{ when, what, accent }] (≤ 6)
 * Extras: viz.format ('₺' | '%' | 'n' | 'x') formats data values; outputs[].accent picks the accent tile
 * (default: the last output); viz.icon picks the icons-kind glyph (default person).
 * Whatif expressions: numbers, var ids, + - * / ( ), unary minus; × · ÷ − – are accepted as aliases. Never eval'd.
 */
(function () {
  'use strict';

  const WORDS = {
    tr: { before: 'Önce', after: 'Sonra' },
    en: { before: 'Before', after: 'After' },
  };
  const words = ctx => WORDS[String(ctx.lang).slice(0, 2)] || WORDS.en;
  const isTall = ctx => ctx.aspect === 'tall';
  const arr = v => (Array.isArray(v) ? v : v == null ? [] : [v]);
  const fin = v => typeof v === 'number' && isFinite(v);
  const str = v => (v == null ? '' : String(v));

  /* ---------- numbers ---------- */
  const NF = new Map();
  function nf(lang, o) {
    const k = lang + '|' + JSON.stringify(o || {});
    let f = NF.get(k);
    if (!f) { try { f = new Intl.NumberFormat(lang, o); } catch (_) { f = new Intl.NumberFormat('en', o); } NF.set(k, f); }
    return f;
  }
  // ₺ → "1.240 ₺" (tr) / "1,240 ₺" (en); % → "%31" (tr) / "31%" (en); x → "2,5×"; n → plain
  // $ € £ → Intl currency in the story lang ("$1,240", "1.240 €"); "currency" + an ISO `currency` code ("JPY")
  // a trailing "k" ("$k", "₺k", "nk"), format "compact" or compact: true → short compact ("$22k", "3,1 mn ₺"); ≥ 1e6 is always compact
  const CUR = { $: 'USD', '€': 'EUR', '£': 'GBP', '₺': 'TRY' };
  const isFmt = f => /^((\$|€|£|₺|%|x|×|n|currency)k?|compact)$/.test(str(f));
  const spec = o => (o && typeof o === 'object' ? { format: o.format, currency: o.currency, compact: o.compact } : { format: o });
  function fmt(v, f, lang) {
    if (!fin(v)) return '—';
    f = spec(f);
    let format = str(f.format || 'n'), short = !!f.compact;
    if (format === 'compact') format = 'nk';
    if (format.length > 1 && format.endsWith('k')) { format = format.slice(0, -1); short = true; }
    const big = Math.abs(v) >= 1e6;
    const c = short && Math.abs(v) >= 1e3 ? { notation: 'compact', compactDisplay: 'short', maximumFractionDigits: Math.abs(v) < 1e4 || big ? 1 : 0 }

    const tidy = s => s.replace(/(\d)\s?K\b/, '$1k').replace(/\bMn\b/, 'mn').replace(/\bMr\b/, 'mr').replace(/(\d) B\b/, '$1 b');   // "$22k", "3,1 mn"
    const code = format === 'currency' ? str(f.currency).toUpperCase() : CUR[format];
    switch (format) {
      case '%': return nf(lang, { style: 'percent', maximumFractionDigits: Math.abs(v) < 10 && v % 1 ? 1 : 0 }).format(v / 100);
      case 'x': case '×': return nf(lang, { maximumFractionDigits: 1 }).format(v) + '×';
      case '₺': return tidy(nf(lang, c || { maximumFractionDigits: 0 }).format(v)) + ' ₺';   // Turkish style, symbol after, in every lang
      case 'n': return tidy(nf(lang, c || { maximumFractionDigits: Math.abs(v) < 100 ? 1 : 0 }).format(v));
      default: {
        if (!/^[A-Z]{3}$/.test(code || '')) return fmt(v, Object.assign({}, f, { format: short ? 'nk' : 'n' }), lang);
        const o = Object.assign({ style: 'currency', currency: code, currencyDisplay: 'narrowSymbol' }, c || { maximumFractionDigits: Math.abs(v) < 100 && v % 1 ? 2 : 0 });
        return tidy(nf(lang, o).format(v));

  /* ---------- whatif expressions: a tiny recursive-descent parser, never eval ---------- */
  function compile(src, ids) {
    const s = str(src).replace(/[×·]/g, '*').replace(/[−–]/g, '-').replace(/÷/g, '/');

function buildChrome() {

  document.body.appendChild(root);

    root, prog: q('.ct-prog'), title: q('.ct-title b'), sub: q('.ct-title span'), kick: q('.ct-kick'), kickNum: q('.ct-kick em'),
    kickTxt: q('.ct-kick span'), area: q('.ct-area'), box: q('.ct-box'), svg: q('.ct-svg'), defs: q('.ct-svg defs'),
    html: q('.ct-html'), cap: q('.ct-cap p'), count: q('.ct-count'), prev: q('[data-act="prev"]'), next: q('[data-act="next"]'),

}
function wire() {
  $.prev.addEventListener('click', () => { stop(); nav(-1); });
  $.next.addEventListener('click', () => { stop(); nav(1); });
  $.play.addEventListener('click', () => (playing ? stop() : play()));
  $.chipB.addEventListener('click', () => setState('before'));
  $.chipA.addEventListener('click', () => setState('after'));
  $.root.querySelector('[data-act="present"]').addEventListener('click', () => setPresent(!present));
  const interactive = t => t.closest && t.closest('input,button,select,textarea,a,label,[data-nonav]');
  let p0 = null;
  $.area.addEventListener('pointerdown', e => { p0 = interactive(e.target) ? null : { x: e.clientX, y: e.clientY }; });
  $.area.addEventListener('pointercancel', () => { p0 = null; });
  $.area.addEventListener('pointerup', e => {
    if (!p0) return;
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    p0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) { stop(); nav(dx < 0 ? 1 : -1); return; }
    if (Math.hypot(dx, dy) < 10) { const r = $.box.getBoundingClientRect(); stop(); nav(e.clientX < r.left + r.width * 0.22 ? -1 : 1); }
  });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') {
      if ((k === ' ' || k === 'Enter') && t && t.tagName === 'BUTTON') return;   // let the button act
      e.preventDefault(); stop(); nav(1);
    } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); stop(); nav(-1); }
    else if (k === 'Home') { stop(); show(0); }
    else if (k === 'End') { stop(); show(S.frames.length - 1); }
    else if (/^[1-9]$/.test(k)) { const i = +k - 1; if (i < S.frames.length) { stop(); show(i); } }
    else if (k === 'p' || k === 'P') playing ? stop() : play();
    else if (k === 'f' || k === 'F') setPresent(!present);
    else if (k === 'n' || k === 'N') setNotes(!notesOpen);
    else if (k === 'd' || k === 'D') setState(state === 'after' ? 'before' : 'after');
    else if (k === 't' || k === 'T') { applyTheme(theme === 'paper' ? 'night' : 'paper'); renderLive(cur, false); }
    else if (k === 'Escape' && present) setPresent(false);
  });
  addEventListener('hashchange', () => {
    const k = parseInt(location.hash.slice(1), 10) - 1;
    if (k >= 0 && k < S.frames.length && k !== cur) { stop(); show(k); }
  });
  addEventListener('resize', () => {
    const a = chooseAspect();
    if (a !== aspect) { setAspect(a); seekI = -1; renderLive(cur, false); }
    fit();
  });
  new ResizeObserver(fit).observe($.area);
}

/* ---------- boot ---------- */
async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const sample = JSON.stringify(S).slice(0, 4000) + ' ğüşıöçİĞÜŞÖÇ₺→×·';
  const specs = ['400 32px Newsreader', '500 32px Newsreader', '600 32px Newsreader', 'italic 400 32px Newsreader', 'italic 500 32px Newsreader',
    '400 20px "IBM Plex Sans"', '500 20px "IBM Plex Sans"', '600 20px "IBM Plex Sans"', 'italic 400 20px "IBM Plex Sans"',
    '400 20px "IBM Plex Mono"', '500 20px "IBM Plex Mono"', '400 20px "Shantell Sans"', '600 20px "Shantell Sans"'];
  let timedOut = false;
  const all = Promise.all(specs.map(s => document.fonts.load(s, sample).catch(() => null)));
  await Promise.race([all, new Promise(r => setTimeout(() => { timedOut = true; r(); }, 3500))]);
  if (timedOut) {
    addIssue('warn', 'fonts', 'fonts did not load in time (offline?); fallback fonts used');
    all.then(() => { mcache.clear(); if (cur >= 0 && !seekMode) renderLive(cur, false); });
  }
}
function validate() {
  for (const asp of ['wide', 'tall']) S.frames.forEach((fr, i) => {
    for (const st of fr.compare ? ['after', 'before'] : ['after']) { OFF.state = st; render(OFF, i, asp, false); }
  });
  OFF.stage.textContent = ''; OFF.over.textContent = ''; OFF.html.textContent = ''; OFF.state = 'after';
}
async function boot(story) {
  if (S) return chalk.ready;
  try {
    if (typeof story === 'string') story = JSON.parse(story);
    if (!story || !Array.isArray(story.frames) || !story.frames.length) throw new Error('story needs a non-empty "frames" array');
  } catch (err) { fatal('story could not be read: ' + err.message); return chalk.ready; }
  S = story;
  S.frames = S.frames.map((fr, i) => {
    if (!fr || typeof fr !== 'object') { addIssue('error', `frame ${i + 1}`, 'frame is not an object'); return { lens: '?' }; }
    if (!fr.lens) addIssue('error', `frame ${i + 1}`, 'frame has no "lens"');
    const n = words(plain(fr.caption));
    if (n > 20) addIssue('warn', `frame ${i + 1}`, `caption has ${n} words (≤ 20)`);
    return fr;
  });
  lang = String(S.lang || 'en');
  tx = L10N[lang.slice(0, 2).toLowerCase()] || L10N.en;
  seed = (hashStr(S.title || 'chalk-talk') % 997) + 1;
  runtime = Math.round(S.frames.reduce((a, fr, i) => a + dwell(i), 0) / 1000);
  document.documentElement.lang = lang;
  document.title = S.title ? S.title + (S.subtitle ? ' · ' + S.subtitle : '') : 'chalk-talk';
  buildChrome();
  if (!ANIM) document.documentElement.classList.add('still');
  applyTheme(qs.get('theme') || S.theme || 'paper');
  setAspect(chooseAspect());
  updatePlayBtn();
  await loadFonts();
  validate();
  fit();
  const h = parseInt(location.hash.slice(1), 10);
  show(h >= 1 && h <= S.frames.length ? h - 1 : 0, { instant: !ANIM });
  wire();
  if (qs.has('present')) setPresent(true);
  if (qs.has('play') && ANIM) play();

}
// built pages carry the story inline; dev.html calls chalk.boot(story) itself

/* ---- lens-title.js ---- */
/* chalk-talk frames · lens: title  (reference lens — copy this shape)
 *
 * Fields: headline (≤ 8 words, *word* = accent italic), sub, kind: open | ask | section | close,
 *         items (ask / close, ≤ 3 short lines), sign (ask, e.g. "onay?" — an empty stamp waiting for a yes),
 *         label (section: replaces the "PART 01" counter; close: a small masthead, e.g. "in one line").
 * close = the calm ending of a lesson / walkthrough: the takeaway, up to 3 things to remember, no sign,
 *         and the open frame's colophon again as a bookend.
 *
 * How a lens is written:
 *  1. Register once:  chalk.lens('title', { render(frame, ctx) { ... } }).
 *  2. Read fields with defaults and report problems with ctx.issue('warn' | 'error', msg); never throw
 *     for bad content (core catches throws, but shows a placeholder instead of your frame).
 *  3. Compose natively for both stages: ctx.aspect is 'wide' (1600×900) or 'tall' (900×1400).
 *     Measure first (ctx.text / ctx.rich return { w, h, top, runs }), then place. A common trick, used
 *     below: draw a block at y = 0 inside a <g>, read its height, then translate the <g> into place.
 *  4. Draw the FINAL picture. Beats (ms) only describe how things arrive; when motion is off
 *     (?snap, reduced motion, chalk.go) the same DOM is shown as is, and chalk.seek freezes beats.
 *  5. Ink, not pixels: colors from ctx.t, fonts by role, ctx.rough(el) for the hand-made line,
 *     ctx.rand(seed) for any variation (never Math.random or Date). The accent marks only what is new.
 */
(function () {
  'use strict';

  const WORDS = {
    tr: { frames: 'kare', sec: 'sn', section: 'Bölüm', sign: 'imza', date: 'tarih', end: 'son' },
    en: { frames: 'frames', sec: 's', section: 'Part', sign: 'signature', date: 'date', end: 'the end' },
  };

  chalk.lens('title', {
    render(frame, ctx) {
      const kind = frame.kind || 'open';
      if (!['open', 'ask', 'section', 'close'].includes(kind)) ctx.issue('warn', `unknown title kind "${kind}" (open | ask | section | close); drawn as open`);
      if (!frame.headline) ctx.issue('warn', 'title frame without a headline; story title used');
      const n = ctx.plain(frame.headline || '').split(/\s+/).filter(Boolean).length;
      if (n > 8) ctx.issue('warn', `headline has ${n} words (≤ 8)`);
      const w = WORDS[String(ctx.lang).slice(0, 2)] || WORDS.en;
      if (kind === 'ask') ask(frame, ctx, w);
      else if (kind === 'section') section(frame, ctx, w);
      else if (kind === 'close') close(frame, ctx, w);
      else open(frame, ctx, w);
    },
  });

  /* ---- shared pieces ---- */

  // the headline: big serif, tight, accent italic words get a hand-inked swash under them
  function headline(ctx, parent, frame, x, y, o) {
    const tall = ctx.aspect === 'tall';
    const hl = ctx.rich(parent, frame.headline || ctx.story.title || '', x, y, Object.assign({
      size: tall ? 132 : 140, minSize: tall ? 64 : 76, lines: tall ? 5 : 3,
      weight: 500, lh: 1.02, ls: -0.02, balance: true,
    }, o));
    const swashes = hl.runs.filter(r => r.st === 'em' && r.w > 0).map((r, k) =>
      swash(ctx, parent, r.x - hl.size * 0.02, r.x + r.w + hl.size * 0.05, r.y + hl.size * 0.17, hl.size * 0.07, `${ctx.index}-${k}`));
    return { hl, swashes };
  }

  // a tapered brush stroke, slightly rising, filled with the accent
  function swash(ctx, parent, x0, x1, y, th, seed) {
    const r = ctx.rand('swash-' + seed), w = x1 - x0, lift = th * (0.5 + r() * 0.6);
    const d = `M${x0} ${y + th * 0.25}`
      + `C${x0 + w * 0.3} ${y - th * 0.35} ${x0 + w * 0.68} ${y - th * 0.55 - lift} ${x1} ${y - lift - th * 0.15}`
      + `C${x1 - w * 0.02} ${y - lift + th * 0.35} ${x0 + w * 0.7} ${y + th * 0.25 - lift * 0.4} ${x0 + w * 0.32} ${y + th * 0.75}`
      + `C${x0 + w * 0.15} ${y + th * 0.95} ${x0 + w * 0.04} ${y + th * 0.85} ${x0} ${y + th * 0.25}Z`;
    return ctx.rough(ctx.el('path', { d, fill: ctx.t.accent, opacity: 0.92 }, parent), 1);
  }

  // short ink rule + small caps label, e.g. "—— ÜRÜN ÖNERİSİ · VP SUNUMU"
  function label(ctx, parent, str, x, y, o = {}) {
    const g = ctx.el('g', {}, parent), rule = 34, gap = 16;
    const t = ctx.text(g, str, x + rule + gap, y, { font: 'mono', size: o.size || 20, ls: 0.16, upper: true, color: o.color || 'ink2', weight: 500, lines: 1, maxW: o.maxW || 1200 });
    ctx.el('path', { d: `M${x} ${y + t.h / 2}H${x + rule}`, stroke: ctx.t.ink, 'stroke-width': 1.6, opacity: 0.6 }, g);
    return { el: g, h: t.h };
  }

  // tall poster placement: the block's middle sits ~42% down the space between masthead and colophon
  // (the optical centre, a little above the middle), kept clear of both. Returns the block's dy.
  function poster(top, foot, y0, y1) {
    const want = top + (foot - top) * 0.42 - (y0 + y1) / 2;
    return Math.max(top + 70 - y0, Math.min(want, foot - 90 - y1));
  }

  /* ---- kind: open — the cover ---- */
  function open(frame, ctx, w) {
    const { W, H, t, story } = ctx, tall = ctx.aspect === 'tall';
    const M = tall ? 84 : 150, maxW = tall ? W - M * 2 : 1180;
    const block = ctx.el('g', {}, ctx.stage);
    // wide: one centred block (label, headline, sub). tall: a poster — label as a masthead on top,
    // headline and sub in the upper-middle (optical centre), the colophon at the foot.
    let y = 0, lab = null;
    if (story.subtitle) {
      lab = label(ctx, tall ? ctx.stage : block, story.subtitle, M, tall ? 92 : 0, { size: tall ? 26 : 20, maxW: maxW - 50 });
      if (!tall) y = lab.h + 40;
    }
    const { hl, swashes } = headline(ctx, block, frame, M, y, { maxW });
    let bottom = hl.top + hl.h, sub = null;
    if (frame.sub) {
      sub = ctx.rich(block, frame.sub, M, bottom + (tall ? 46 : 42), { font: 'sans', size: tall ? 38 : 34, color: 'ink2', maxW: tall ? maxW : 920, lines: 3, lh: 1.38 });
      bottom = sub.top + sub.h;
    }
    // colophon: a ruled foot line with the story's name and its length
    const cy = H - (tall ? 118 : 96);
    const mast = lab ? 92 + lab.h : 40;
    const dy = Math.round(tall ? poster(mast, cy, hl.top, bottom) : H * 0.47 - bottom / 2);
    block.setAttribute('transform', `translate(0 ${dy})`);
    if (tall && lab && dy + hl.top < mast + 60) ctx.issue('warn', 'title block runs into the masthead; shorten the headline or sub');
    if (dy + bottom > cy - 36) ctx.issue('warn', 'title block runs into the colophon; shorten the headline or sub');
    const foot = ctx.el('g', {}, ctx.stage);
    // hairlines stay clean: the wobble filter breaks strokes thinner than ~2.5 units
    const rule = ctx.el('path', { d: `M${M} ${cy}H${W - M}`, stroke: t.ink, 'stroke-width': tall ? 2 : 1.6, opacity: 0.4, fill: 'none' }, foot);
    if (story.title && story.title !== frame.headline) ctx.text(foot, story.title, M, cy + 22, { size: tall ? 34 : 26, italic: true, weight: 500, maxW: (W - M * 2) * 0.6, lines: 1 });
    const n = story.frames.length;
    ctx.text(foot, `${n} ${w.frames} · ~${ctx.runtime} ${w.sec}`, W - M, cy + (tall ? 28 : 27), { font: 'mono', size: tall ? 25 : 17, ls: 0.08, color: 'muted', anchor: 'end' });

    // motion: label, headline, sub arrive in reading order; the swash is drawn last, under the idea
    if (lab) ctx.beat(lab.el, 'fade', { at: 0, dy: 8 });
    ctx.beat(hl.el, 'fade', { at: 140, dur: 820, dy: 22 });
    if (sub) ctx.beat(sub.el, 'fade', { at: 560, dur: 700, dy: 14 });
    swashes.forEach((s, k) => ctx.beat(s, 'grow', { at: 980 + k * 180, dur: 620, from: 'left' }));
    ctx.beat(rule, 'draw', { at: 700, dur: 1100 });
    [...foot.querySelectorAll('text')].forEach(e => ctx.beat(e, 'fade', { at: 1200, dy: 0 }));
  }

  /* ---- kind: section — a chapter divider ---- */
  function section(frame, ctx, w) {
    const { W, H, t, story } = ctx, tall = ctx.aspect === 'tall';
    // a section counts only among the unlabelled ones; a "label" replaces the counter (e.g. a takeaway)
    const own = typeof frame.label === 'string' && frame.label.trim() ? frame.label.trim() : null;
    const num = story.frames.slice(0, ctx.index + 1).filter(f => f.lens === 'title' && f.kind === 'section' && !(typeof f.label === 'string' && f.label.trim())).length;
    const cx = W / 2, maxW = tall ? W - 150 : 1240;
    const block = ctx.el('g', {}, ctx.stage);
    const lab = ctx.text(block, own || `${w.section} ${String(num).padStart(2, '0')}`, cx, 0, { maxW, lines: 1, font: 'mono', size: tall ? 26 : 20, ls: 0.2, upper: true, color: 'accent', weight: 500, anchor: 'middle' });
    const ruleY = lab.h + 26;
    const rule = ctx.rough(ctx.el('path', { d: `M${cx - 30} ${ruleY}H${cx + 30}`, stroke: t.ink, 'stroke-width': 3, 'stroke-linecap': 'round', fill: 'none' }, block), 1);
    const { hl, swashes } = headline(ctx, block, frame, cx, ruleY + 46, { anchor: 'middle', maxW, size: tall ? 132 : 120, lines: tall ? 5 : 3 });
    let bottom = hl.top + hl.h, sub = null;
    if (frame.sub) {
      sub = ctx.rich(block, frame.sub, cx, bottom + 40, { font: 'sans', size: tall ? 36 : 32, color: 'ink2', maxW: tall ? maxW : 980, lines: 3, lh: 1.38, anchor: 'middle' });
      bottom = sub.top + sub.h;
    }
    block.setAttribute('transform', `translate(0 ${Math.round(H / 2 - bottom / 2)})`);
    ctx.beat(lab.el, 'fade', { at: 0, dy: 8 });
    ctx.beat(rule, 'draw', { at: 200, dur: 500 });
    ctx.beat(hl.el, 'fade', { at: 300, dur: 800, dy: 20 });
    if (sub) ctx.beat(sub.el, 'fade', { at: 700, dur: 700, dy: 12 });
    swashes.forEach((s, k) => ctx.beat(s, 'grow', { at: 1100 + k * 180, dur: 620, from: 'left' }));
  }

  /* ---- kind: close — the calm ending: the takeaway, up to 3 things to keep, the colophon as a bookend ---- */
  function close(frame, ctx, w) {
    const { W, H, t, story } = ctx, tall = ctx.aspect === 'tall';
    const all = Array.isArray(frame.items) ? frame.items : [];
    if (all.length > 3) ctx.issue('warn', `close has ${all.length} items (≤ 3); the rest are left out`);
    if (frame.sign) ctx.issue('warn', 'close has no sign; use kind "ask" for a request');
    const items = all.slice(0, 3);
    const M = tall ? 84 : 150, colW = W - M * 2;
    const block = ctx.el('g', {}, ctx.stage);
    let y = 0, lab = null;
    if (typeof frame.label === 'string' && frame.label.trim()) {
      lab = label(ctx, block, frame.label, M, 0, { size: tall ? 24 : 19, color: 'accent', maxW: colW - 50 });
      y = lab.h + (tall ? 40 : 32);
    }
    const { hl, swashes } = headline(ctx, block, frame, M, y, { maxW: tall ? colW : 1180, size: tall ? 124 : 116, minSize: tall ? 60 : 68, lines: tall ? 4 : 2 });
    let bottom = hl.top + hl.h, sub = null;
    if (frame.sub) {
      sub = ctx.rich(block, frame.sub, M, bottom + (tall ? 40 : 34), { font: 'sans', size: tall ? 36 : 30, color: 'ink2', maxW: tall ? colW : 980, lines: 3, lh: 1.38 });
      bottom = sub.top + sub.h;
    }
    // the things to keep: side by side in wide (the story in a row), stacked in tall; each under a hairline
    const rows = [];
    if (items.length) {
      const top = bottom + (tall ? 70 : 64), gap = 56;
      const n = items.length, cw = tall ? colW : (colW - gap * (n - 1)) / n;
