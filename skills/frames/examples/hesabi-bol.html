      if (!fits(txt, Math.min(fs0, kh * 0.62), { x: x + w / 2, y: ky + kh / 2, anchor: 'middle', valign: 'middle', weight: 700, color: col, maxW: w - kh * 0.5 }))
        ctx.el('path', { d: `M${r1(x + w * 0.3)} ${r1(ky + kh / 2)}h${r1(w * 0.4)}`, stroke: col, 'stroke-width': lw * 1.4, 'stroke-linecap': 'round' }, g);
    } else if (key.type === 'amount') {
      if (!fits(txt, Math.min(fs0 * 1.35, box.h * 0.34), { y: ky, weight: 700, color: key.accent ? 'accent' : 'ink' }))
        ctx.el('path', { d: `M${r1(x)} ${r1(ky + kh / 2)}h${r1(w * 0.55)}`, stroke: fill, 'stroke-width': Math.max(4, kh * 0.4), 'stroke-linecap': 'round' }, g);
    } else {
      const cr = Math.min(kh * 0.45, w * 0.14), cy = ky + kh / 2, isCheck = key.type === 'check';
      if (isCheck) {
        ctx.el('circle', { cx: x + cr, cy, r: cr, fill: key.accent ? t.accent : t.paper2, stroke: t.ink, 'stroke-width': lw }, g);
        ctx.el('path', { d: `M${r1(x + cr * 0.5)} ${r1(cy)}l${r1(cr * 0.35)} ${r1(cr * 0.38)}l${r1(cr * 0.7)} ${r1(-cr * 0.8)}`, stroke: key.accent ? t.paper2 : t.ink, 'stroke-width': lw, fill: 'none', 'stroke-linecap': 'round' }, g);
      }
      const tx = isCheck ? x + cr * 2.4 : x, col = key.accent && !isCheck ? 'accent' : 'ink';
      if (!fits(txt, fs0 * 0.85, { x: tx, y: cy, valign: 'middle', maxW: x + w - tx, color: col }))
        scrib(tx, cy, (x + w - tx) * 0.8, key.accent && !isCheck ? t.accent : t.muted);
    }
    return g;
  }

  /* -------------------------------------------------------------- bubbles */

  // rounded box with a tail notched into one edge: one clean outline, filled and stroked once
  function bubblePath(x, y, w, h, r, tail) {
    const T = tail || {};
    const q = (a, b) => {   // tail from base a to tip to base b
      const tp = T.tip;
      return `L${r1(a.x)} ${r1(a.y)}Q${r1(a.x + (tp.x - a.x) * 0.25)} ${r1(a.y + (tp.y - a.y) * 0.6)} ${r1(tp.x)} ${r1(tp.y)}Q${r1(b.x + (tp.x - b.x) * 0.55)} ${r1(b.y + (tp.y - b.y) * 0.4)} ${r1(b.x)} ${r1(b.y)}`;
    };
    let d = `M${r1(x + r)} ${r1(y)}`;
    if (T.side === 'top') d += q({ x: Math.min(T.a, T.b), y }, { x: Math.max(T.a, T.b), y });
    d += `L${r1(x + w - r)} ${r1(y)}Q${r1(x + w)} ${r1(y)} ${r1(x + w)} ${r1(y + r)}`;
    if (T.side === 'right') d += q({ x: x + w, y: Math.min(T.a, T.b) }, { x: x + w, y: Math.max(T.a, T.b) });
    d += `L${r1(x + w)} ${r1(y + h - r)}Q${r1(x + w)} ${r1(y + h)} ${r1(x + w - r)} ${r1(y + h)}`;
    if (T.side === 'bottom') d += q({ x: Math.max(T.a, T.b), y: y + h }, { x: Math.min(T.a, T.b), y: y + h });
    d += `L${r1(x + r)} ${r1(y + h)}Q${r1(x)} ${r1(y + h)} ${r1(x)} ${r1(y + h - r)}`;
    if (T.side === 'left') d += q({ x, y: Math.max(T.a, T.b) }, { x, y: Math.min(T.a, T.b) });
    d += `L${r1(x)} ${r1(y + r)}Q${r1(x)} ${r1(y)} ${r1(x + r)} ${r1(y)}Z`;
    return d;
  }

  function measureBubble(K, parent, text, fs, maxW) {
    const g = K.ctx.el('g', { class: 'mo-btext' }, parent);
    const T = K.ctx.text(g, text, 0, 0, { font: 'hand', size: fs, weight: 500, anchor: 'middle', valign: 'middle', maxW, lines: 4, lh: 1.16, color: 'ink' });
    return { g, T, w: Math.max(T.w + fs * 1.5, T.h + fs * 1.6, fs * 3), h: T.h + fs * 0.95 };
  }

  // place every bubble so it covers no face (heads are hard obstacles), stays in its box, sits near its speaker
  function placeBubbles(K, layer, speakers, heads, opts = {}) {
    const { ctx, t } = K, placed = [], out = [];
    const ov = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
    const hboxes = heads.map(h => ({ x0: h.x - h.r * 0.95, x1: h.x + h.r * 0.95, y0: Math.min(h.top, h.y - h.r * 1.1), y1: h.y + h.r * 0.9 }));
    const soft = opts.soft || [];
    const list = [];
    speakers.forEach(sp => { if (sp.say) list.push({ sp, kind: 'say', text: sp.say }); if (sp.think) list.push({ sp, kind: 'think', text: sp.think }); });
    for (const it of list) {
      const { sp } = it, box = sp.box, m = 16;
      const fs = opts.fs || (K.tall ? 34 : 30);
      const maxW = Math.min(box.w * (box.h > box.w ? 0.7 : 0.4), fs * 13);
      const M = measureBubble(K, layer, it.text, fs, maxW);
      const bw = it.kind === 'think' ? M.w * 1.12 + 16 : M.w, bh = it.kind === 'think' ? M.h * 1.3 + 14 : M.h;
      const gapY = it.kind === 'think' ? 54 : 34;
      const cands = [];
      const offs = [0, 0.3, 0.55, 0.85, 1.1];
      for (let lvl = 0; lvl < 6; lvl++) {
        const cy = sp.y - sp.r - gapY - bh / 2 - lvl * (bh * 0.55 + 18);
        for (const k of offs) for (const sg of k ? [sp.f, -sp.f] : [1]) cands.push({ cx: sp.x + k * bw * 0.5 * sg * 1.0 + (k ? sg * sp.r * 0.4 : 0), cy, pen: lvl * 1.2 + k * 0.6 + (sg === -sp.f ? 0.5 : 0) });
      }
      for (const sg of [sp.f, -sp.f]) for (const dy of [-0.9, -0.3, 0.3]) cands.push({ cx: sp.x + sg * (sp.r + 30 + bw / 2), cy: sp.y + dy * sp.r, pen: 1.4 + (sg === -sp.f ? 0.6 : 0) + Math.abs(dy) });
      let best = null;
      for (const c of cands) {
        const cx = clamp(c.cx, box.x + m + bw / 2, box.x + box.w - m - bw / 2), cy = clamp(c.cy, box.y + m + bh / 2, box.y + box.h - m - bh / 2);
        const r = { x0: cx - bw / 2, x1: cx + bw / 2, y0: cy - bh / 2, y1: cy + bh / 2 };
        const area = bw * bh;
        let sc = c.pen;
        // faces and other bubbles are (almost) hard obstacles; props and labels are soft
        for (const hb of hboxes) { const o = ov(r, hb); if (o > 0) sc += 60 + 900 * o / area; }
        for (const p of placed) { const o = ov({ x0: r.x0 - 14, x1: r.x1 + 14, y0: r.y0 - 14, y1: r.y1 + 14 }, p); if (o > 0) sc += 40 + 600 * o / area; }
        for (const so of soft) sc += 24 * ov(r, so) / area;
        const dist = Math.hypot(cx - sp.x, cy - sp.y) - sp.r;
        sc += Math.max(0, dist - 120) / 90;
        if (!best || sc < best.sc) best = { sc, cx, cy, r };
      }
      placed.push(best.r);
      const x = best.cx - bw / 2, y = best.cy - bh / 2;
      // tail tip: on a ring around the head, toward the bubble
      const ang = Math.atan2(best.cy - sp.y, best.cx - sp.x);
      const tip = sp.off ? { x: sp.x, y: sp.y } : { x: sp.x + Math.cos(ang) * (sp.r + 6), y: sp.y + Math.sin(ang) * (sp.r + 6) };
      const g = ctx.el('g', { class: 'mo-bubble' }, layer);
      const shape = ctx.el('g', {}, g);
      if (it.kind === 'say') {
        const r = Math.min(bh / 2, 30);
        let side;
        if (tip.y > y + bh) side = 'bottom'; else if (tip.y < y) side = 'top'; else side = tip.x < x ? 'left' : 'right';
        let tail;
        if (side === 'bottom' || side === 'top') {
          const c0 = clamp(tip.x + (best.cx - tip.x) * 0.35, x + r + 16, x + bw - r - 16);
          tail = { side, a: c0 - 15, b: c0 + 15, tip };
        } else {
          const c0 = clamp(tip.y + (best.cy - tip.y) * 0.35, y + r * 0.6 + 12, y + bh - r * 0.6 - 12);
          tail = { side, a: c0 - 13, b: c0 + 13, tip };
        }
        ctx.el('path', { d: bubblePath(x, y, bw, bh, r, tail), fill: t.paper2, stroke: t.ink, 'stroke-width': 3.4, 'stroke-linejoin': 'round' }, shape);
      } else {
        const cx = best.cx, cy = best.cy, rx = bw / 2, ry = bh / 2;
        const per = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
        const nb = Math.max(8, Math.round(per / 58));
        ctx.el('path', { d: scallop(cx, cy, rx - 10, ry - 10, 0, Math.PI * 2, nb, 26) + 'Z', fill: t.paper2, stroke: t.ink, 'stroke-width': 3.4, 'stroke-linejoin': 'round' }, shape);
        // trailing dots toward the thinker
        const ex = cx + Math.cos(ang + Math.PI) * rx * 0.92, ey = cy + Math.sin(ang + Math.PI) * ry * 0.92;
        [[0.3, 12], [0.6, 8.5], [0.86, 5.5]].forEach(([k, rr]) => ctx.el('circle', { cx: r1(ex + (tip.x - ex) * k), cy: r1(ey + (tip.y - ey) * k), r: rr, fill: t.paper2, stroke: t.ink, 'stroke-width': 3 }, shape));
      }
      ctx.rough(shape, 1);
      g.appendChild(M.g);
      M.g.setAttribute('transform', `translate(${r1(best.cx)} ${r1(best.cy)})`);
      out.push({ g, shape, text: M.T.el, kind: it.kind });
    }
    return out;
  }

  function bubbleBeats(K, list, at) {
    list.forEach((b, k) => {
      const t0 = at + k * 760;
      K.ctx.beat(b.shape, 'pop', { at: t0, dur: 420 });
      K.ctx.beat(b.text, 'type', { at: t0 + 220 });
    });
    return at + list.length * 760;
  }

  /* --------------------------------------------------------- screen ui */

  // a tasteful small app screen from a `screen` ui list: header | text | amount | button | list | avatars |
  // toast | input | progress | check | image | divider. k = scale against a 340-wide phone screen.
  function screenUI(K, parent, items, box, k, o = {}) {
    const { ctx, t } = K;
    const g = ctx.el('g', { class: 'mo-ui' }, parent);
    const els = [];
    const pad = 22 * k, x = box.x + pad, w = box.w - pad * 2;
    let y = box.y + (o.tiny ? 10 : 18) * k;
    const can = fs => fs >= K.min;
    const scrib = (yy, ww, col = t.muted) => ctx.el('path', { d: scribble(x, yy, ww, Math.max(1.5, 3 * k)), stroke: col, 'stroke-width': Math.max(2.6, 3.6 * k), fill: 'none', 'stroke-linecap': 'round' }, g);
    const line = (d, o2 = {}) => ctx.el('path', Object.assign({ d, fill: 'none', stroke: t.ink, 'stroke-width': Math.max(2.6, 3.2 * k), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, o2), g);
    let cut = false;
    for (const it of items) {
      if (!it || typeof it !== 'object') continue;
      if (y > box.y + box.h - 30 * k) { cut = true; break; }
      const ig = ctx.el('g', {}, g), txt = str(it.text);
      const T = (s0, fs, opt = {}) => ctx.text(ig, s0, opt.x ?? x, y, Object.assign({ font: 'hand', size: fs, maxW: w, lines: 2, lh: 1.12, color: 'ink' }, opt));
      switch (it.type) {
        case 'header': {
          const fs = 40 * k;
          if (can(fs)) y += T(txt, fs, { weight: 600, lines: 2 }).h + 14 * k; else { scrib(y + 14 * k, w * 0.6, t.ink); y += 34 * k; }
          break;
        }
        case 'text': {
          const fs = 23 * k;
          if (can(fs)) y += T(txt, fs, { color: 'ink2', lines: 3, lh: 1.25 }).h + 14 * k; else { scrib(y + 8 * k, w * 0.9); scrib(y + 26 * k, w * 0.6); y += 44 * k; }
          break;
        }
        case 'amount': {
          const fs = 66 * k;
          if (can(fs)) y += T(txt, fs, { weight: 700, lines: 1, minSize: 40 * k, color: it.accent ? 'accent' : 'ink' }).h + 14 * k;
          else { line(`M${x} ${y + 20 * k}h${w * 0.5}`, { 'stroke-width': Math.max(4, 12 * k), stroke: it.accent ? t.accent : t.ink }); y += 46 * k; }
          break;
        }
        case 'button': {
          const bh = 66 * k, fs = 28 * k;
          const r = ctx.el('rect', { x, y, width: w, height: bh, rx: bh / 2, fill: it.accent ? t.accent : t.paper2, stroke: t.ink, 'stroke-width': Math.max(2.6, 3.6 * k) }, ig);
          ctx.rough(r, 1);
          if (can(fs)) T(txt, fs, { x: x + w / 2, anchor: 'middle', weight: 700, lines: 1, minSize: K.min, color: it.accent ? t.paper2 : 'ink' }).el.setAttribute('transform', `translate(0 ${r1(bh / 2 - fs * 0.6)})`);
          else ctx.el('path', { d: `M${x + w * 0.3} ${y + bh / 2}h${w * 0.4}`, stroke: it.accent ? t.paper2 : t.ink, 'stroke-width': Math.max(2.6, 5 * k), 'stroke-linecap': 'round' }, ig);
          y += bh + 16 * k;
          break;
        }
        case 'list': {
          const rows = Array.isArray(it.items) && it.items.length ? it.items : [null, null, null];
          for (const row of rows) {
            if (y > box.y + box.h - 30 * k) { cut = true; break; }
            const fs = 24 * k;
            ctx.el('circle', { cx: x + 12 * k, cy: y + 16 * k, r: 12 * k, fill: K.tint, stroke: t.ink, 'stroke-width': Math.max(2.6, 3 * k) }, ig);
            if (row != null && can(fs)) ctx.text(ig, str(typeof row === 'object' ? row.text || row.label : row), x + 36 * k, y + 2 * k, { font: 'hand', size: fs, maxW: w - 36 * k, lines: 1, color: 'ink' });
            else ctx.el('path', { d: scribble(x + 36 * k, y + 16 * k, w * 0.55, Math.max(1.5, 3 * k)) + `M${x + w - 40 * k} ${y + 16 * k}h${30 * k}`, stroke: t.muted, 'stroke-width': Math.max(2.6, 3.4 * k), fill: 'none', 'stroke-linecap': 'round' }, ig);
            y += 46 * k;
          }
          y += 8 * k;
          break;
        }
        case 'avatars': {
          const names = Array.isArray(it.items) ? it.items : [];
          const hs = 0.46 * k, step = 70 * k;
          names.slice(0, 6).forEach((nm, j) => {
            const info = [...K.cast.values()].find(c => c.name === nm || c.id === nm);
            const cx = x + 30 * k + j * step, cy = y + 34 * k;
            if (info) head(K, ig, info, cx, cy, hs, 'happy', 1);
            else { ctx.el('circle', { cx, cy, r: 26 * k, fill: K.tint, stroke: t.ink, 'stroke-width': 3 }, ig); if (can(22 * k)) ctx.text(ig, String(nm).slice(0, 1), cx, cy, { font: 'hand', size: 24 * k, anchor: 'middle', valign: 'middle', weight: 600 }); }
          });
          y += 78 * k;
          break;
        }
        case 'toast': {
          // accent: true → accent fill; the text keeps its side padding and wraps to a second line before it is cut
          const fs = 22 * k, padX = 18 * k;
          let bh = 54 * k;
          const r = ctx.el('rect', { x, y, width: w, height: bh, rx: 14 * k, fill: it.accent ? t.accent : t.ink }, ig);
          if (can(fs)) {
            const tt = T(txt, fs, { x: x + padX, maxW: w - 2 * padX, color: t.paper2, lines: 2, lh: 1.15, minSize: K.min });
            bh = Math.max(bh, tt.h + 22 * k);
            r.setAttribute('height', r1(bh));
            tt.el.setAttribute('transform', `translate(0 ${r1((bh - tt.h) / 2)})`);
          }
          y += bh + 14 * k;
          break;
        }
        case 'input': {
          const bh = 56 * k, fs = 22 * k;
          const r = ctx.el('rect', { x, y, width: w, height: bh, rx: 12 * k, fill: t.paper2, stroke: t.ink, 'stroke-width': Math.max(2.6, 3 * k) }, ig);
          ctx.rough(r, 1);
          if (can(fs)) T(txt || '…', fs, { x: x + 16 * k, color: 'muted', lines: 1 }).el.setAttribute('transform', `translate(0 ${r1(bh / 2 - fs * 0.62)})`);
          y += bh + 14 * k;
          break;
        }
        case 'progress': {
          let v = +it.value;
          if (!isFinite(v)) { const mm = txt.match(/(\d+(?:[.,]\d+)?)/); v = mm ? parseFloat(mm[1].replace(',', '.')) : 60; }
          if (v > 1) v /= 100;
          v = clamp(v, 0, 1);
          const fs = 20 * k;
          if (txt && can(fs)) { y += T(txt, fs, { font: 'mono', color: 'ink2', lines: 1 }).h + 6 * k; }
          ctx.el('rect', { x, y, width: w, height: 18 * k, rx: 9 * k, fill: t.paper2, stroke: t.ink, 'stroke-width': Math.max(2.6, 3 * k) }, ig);
          ctx.el('rect', { x, y, width: Math.max(18 * k, w * v), height: 18 * k, rx: 9 * k, fill: it.accent ? t.accent : t.ink, stroke: t.ink, 'stroke-width': Math.max(2.6, 3 * k) }, ig);
          y += 34 * k;
          break;
        }
        case 'check': {
          const fs = 24 * k;
          ctx.el('circle', { cx: x + 16 * k, cy: y + 16 * k, r: 16 * k, fill: it.accent ? t.accent : t.paper2, stroke: t.ink, 'stroke-width': Math.max(2.6, 3 * k) }, ig);
          line(`M${x + 8 * k} ${y + 17 * k}l${6 * k} ${6 * k}l${11 * k} ${-13 * k}`, { stroke: it.accent ? t.paper2 : t.ink });
          if (can(fs)) ctx.text(ig, txt, x + 44 * k, y + 2 * k, { font: 'hand', size: fs, maxW: w - 44 * k, lines: 1 });
          else scrib(y + 16 * k, w * 0.5);
          y += 48 * k;
          break;
        }
        case 'image': {
          const ih = 130 * k;
          ctx.el('rect', { x, y, width: w, height: ih, rx: 10 * k, fill: K.tint, stroke: t.ink, 'stroke-width': Math.max(2.6, 3 * k) }, ig);
          line(`M${x + 12 * k} ${y + ih - 14 * k}L${x + w * 0.36} ${y + ih * 0.42}L${x + w * 0.56} ${y + ih * 0.68}L${x + w * 0.72} ${y + ih * 0.5}L${x + w - 12 * k} ${y + ih - 14 * k}`);
          ctx.el('circle', { cx: x + w * 0.78, cy: y + ih * 0.28, r: 12 * k, fill: 'none', stroke: t.ink, 'stroke-width': Math.max(2.6, 3 * k) }, ig);
          y += ih + 14 * k;
          break;
        }
        case 'divider':
          line(`M${x} ${y + 10 * k}H${x + w}`, { stroke: t.muted, 'stroke-dasharray': `${7 * k} ${9 * k}` });
          y += 26 * k;
          break;
        default:
          ctx.issue('warn', `unknown screen ui type "${it.type}"`);
      }
      els.push(ig);
    }
    if (cut && !o.tiny) ctx.issue('warn', 'screen ui list is longer than the screen; the rest is cut');
    return { g, els, bottom: y, cut };
  }

  /* ---------------------------------------------------------- phone etc. */

  // a phone seen from the front; when it runs past `limit` it is cut straight there (the panel crops it)
  function phoneBody(K, g, cx, top, w, h, acc, limit) {
    const { ctx, t } = K;
    const x = cx - w / 2, r = w * 0.15, cutB = limit != null && top + h > limit, yb = cutB ? limit : top + h;
    const b = ctx.el('g', { fill: 'none', stroke: t.ink, 'stroke-width': 5, 'stroke-linejoin': 'round' }, g);
    const outline = (x0, y0, x1, y1, rr) => cutB
      ? `M${r1(x0)} ${r1(y1)}V${r1(y0 + rr)}Q${r1(x0)} ${r1(y0)} ${r1(x0 + rr)} ${r1(y0)}H${r1(x1 - rr)}Q${r1(x1)} ${r1(y0)} ${r1(x1)} ${r1(y0 + rr)}V${r1(y1)}`
      : `M${r1(x0 + rr)} ${r1(y0)}H${r1(x1 - rr)}Q${r1(x1)} ${r1(y0)} ${r1(x1)} ${r1(y0 + rr)}V${r1(y1 - rr)}Q${r1(x1)} ${r1(y1)} ${r1(x1 - rr)} ${r1(y1)}H${r1(x0 + rr)}Q${r1(x0)} ${r1(y1)} ${r1(x0)} ${r1(y1 - rr)}V${r1(y0 + rr)}Q${r1(x0)} ${r1(y0)} ${r1(x0 + rr)} ${r1(y0)}Z`;
    ctx.el('path', { d: outline(x, top, x + w, yb, r), fill: t.paper2 }, b);
    if (acc) ctx.el('path', { d: outline(x - 8, top - 8, x + w + 8, yb, r + 8), stroke: t.accent, 'stroke-width': 4 }, b);
    ctx.el('rect', { x: r1(cx - w * 0.1), y: r1(top + w * 0.06), width: r1(w * 0.2), height: r1(Math.max(9, w * 0.045)), rx: r1(w * 0.025), fill: t.ink, stroke: 'none' }, b);
    ctx.rough(b, 1);
    return { x: x + w * 0.05, y: top + w * 0.16, w: w * 0.9, h: Math.min(h - w * 0.2, yb - top - w * 0.16), body: b };
  }

  // the owner's hand: fingertips curl round the right edge, the palm and a short thumb hold the left,
  // the sleeve (the owner's top: the hero's accent) comes up from below the frame
  function holdingHand(K, g, ph, sleeve, bottom) {
    const { ctx, t } = K;
    const sc = ph.w / 400, x0 = ph.x, x1 = ph.x + ph.w;
    const fy = Math.min(bottom - 250 * sc, ph.y + ph.h * 0.5);
    const hg = ctx.el('g', { fill: 'none', stroke: t.ink, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    for (let k = 0; k < 3; k++) ctx.el('ellipse', { cx: r1(x1 + 6 * sc), cy: r1(fy + k * 62 * sc), rx: r1(22 * sc), ry: r1(29 * sc), fill: t.paper2 }, hg);
    g.insertBefore(hg, g.firstChild);
    const fg = ctx.el('g', { fill: 'none', stroke: t.ink, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    const by = bottom + 16;
    const arm = `M${r1(x0 - 40 * sc)} ${r1(by)}C${r1(x0 - 30 * sc)} ${r1(Math.min(by, fy + 330 * sc))} ${r1(x0 - 20 * sc)} ${r1(Math.min(by, fy + 270 * sc))} ${r1(x0 + 8 * sc)} ${r1(fy + 222 * sc)}`;
    ctx.el('path', { d: arm, stroke: t.ink, 'stroke-width': r1(112 * sc + 9) }, fg);
    ctx.el('path', { d: arm, stroke: sleeve, 'stroke-width': r1(112 * sc) }, fg);
    // palm on the left edge + thumb resting on the screen edge
    ctx.el('path', { d: `M${r1(x0 - 34 * sc)} ${r1(fy + 216 * sc)}C${r1(x0 - 44 * sc)} ${r1(fy + 150 * sc)} ${r1(x0 - 12 * sc)} ${r1(fy + 112 * sc)} ${r1(x0 + 22 * sc)} ${r1(fy + 118 * sc)}C${r1(x0 + 50 * sc)} ${r1(fy + 124 * sc)} ${r1(x0 + 56 * sc)} ${r1(fy + 196 * sc)} ${r1(x0 + 34 * sc)} ${r1(fy + 236 * sc)}Z`, fill: t.paper2, 'stroke-width': 4 }, fg);
    const thumb = `M${r1(x0 + 14 * sc)} ${r1(fy + 140 * sc)}C${r1(x0 + 30 * sc)} ${r1(fy + 112 * sc)} ${r1(x0 + 46 * sc)} ${r1(fy + 96 * sc)} ${r1(x0 + 62 * sc)} ${r1(fy + 84 * sc)}`;
    ctx.el('path', { d: thumb, stroke: t.ink, 'stroke-width': r1(40 * sc + 8) }, fg);
    ctx.el('path', { d: thumb, stroke: t.paper2, 'stroke-width': r1(40 * sc) }, fg);
    ctx.el('path', { d: `M${r1(x0 + 50 * sc)} ${r1(fy + 88 * sc)}q${r1(6 * sc)} ${r1(-6 * sc)} ${r1(14 * sc)} ${r1(-4 * sc)}`, stroke: t.ink, 'stroke-width': 3 }, fg);
    ctx.rough(hg, 1); ctx.rough(fg, 1);
    return fg;
  }

  function ownerOf(K, frame, msgs) {
    const ins = frame.insert || {};
    if (ins.who && K.cast.has(ins.who)) return K.cast.get(ins.who);
    if (typeof frame.highlight === 'string' && K.cast.has(frame.highlight)) return K.cast.get(frame.highlight);
    if (K.hero && (!msgs || !msgs.length || msgs.some(m => m && m.from === K.hero.id))) return K.hero;
    if (msgs && msgs.length) {
      const cnt = {};
      msgs.forEach(m => { if (m && m.from) cnt[m.from] = (cnt[m.from] || 0) + 1; });
      const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
      if (top) return K.who(top);
    }
    return K.hero;
  }
  const sleeveOf = (K, info, frame) => {
    if (!info) return K.tint;
    const acc = (typeof frame.highlight === 'string' ? frame.highlight === info.id : info.hero);
    return acc ? K.t.accent : K.fill(info.tone, 1);
  };

  // a chat thread: owner's messages on the right, others on the left with their face; a day label when
  // `time` is a day ("Pzt"), a small clock when it is "18:40", "seen" in the accent. Laid out for real
  // (measured), shrunk to fit, oldest messages dropped last.
  function chatUI(K, parent, msgs, box, owner, k0) {
    const { ctx, t } = K;
    const isClock = s0 => /^\s*\d{1,2}[:.]\d{2}\s*$/.test(s0);
    let list = msgs.filter(m => m && typeof m === 'object');
    let fs = Math.max(K.min, 28 * k0), dropped = 0, res = null, got = [];
    const floorFs = Math.max(K.min + (K.tall ? 2 : 5), 28 * k0 * 0.55);
    for (let attempt = 0; attempt < 40; attempt++) {
      const g = ctx.el('g', { class: 'mo-chat' }, parent);
      [res, got] = quietly(ctx, () => thread(g, list, fs));
      if (res.h <= box.h || list.length <= 1) break;
      g.remove();
      if (fs * 0.93 >= floorFs) fs *= 0.93;
      else { list = list.slice(1); dropped++; }
    }
    got.forEach(([l, m]) => ctx.issue(l, m));
    if (dropped) ctx.issue('warn', `chat thread is taller than the screen; the ${dropped} oldest message(s) are left out`);
    return res.els;

    function thread(root, items, fs) {
      const els = [];
      let y = box.y, lastDay = null;
      const av = fs * 2, maxW = box.w * 0.76;
      for (const m of items) {
        const time = str(m.time);
        if (time && !isClock(time) && time !== lastDay) {
          const g = ctx.el('g', { class: 'mo-day' }, root);
          const lab = ctx.text(g, time, box.x + box.w / 2, y + fs * 0.2, { font: 'mono', size: Math.max(K.min, fs * 0.62), color: 'muted', anchor: 'middle', ls: 0.16, upper: true, lines: 1 });
          const cy = lab.top + lab.h / 2, hw = lab.w / 2 + 14;
          ctx.el('path', { d: `M${r1(box.x + box.w / 2 - hw - 44)} ${r1(cy)}h36M${r1(box.x + box.w / 2 + hw + 8)} ${r1(cy)}h36`, stroke: t.line, 'stroke-width': 2.4, fill: 'none' }, g);
          els.push({ g, type: 'day' });
          y = lab.top + lab.h + fs * 0.55;
          lastDay = time;
        }
        const own = !!owner && m.from === owner.id;
        const g = ctx.el('g', { class: 'mo-msg' }, root);
        const tg = ctx.el('g', {}, g);
        const T = ctx.text(tg, clean(ctx, m.text), 0, 0, { font: 'hand', size: fs, weight: 500, maxW: maxW - (own ? 0 : av) - fs * 1.3, lines: 6, lh: 1.16, color: 'ink' });
        const bw = T.w + fs * 1.3, bh = T.h + fs * 0.86;
        const bx = own ? box.x + box.w - bw : box.x + av;
        const sh = ctx.el('path', { d: bubblePath(bx, y, bw, bh, Math.min(bh / 2, fs * 0.8), null), fill: own ? K.tint : t.paper2, stroke: t.ink, 'stroke-width': 3.2 }, g);
        ctx.rough(sh, 1);
        g.appendChild(tg);
        tg.setAttribute('transform', `translate(${r1(bx + fs * 0.65)} ${r1(y + fs * 0.43)})`);
        if (!own) head(K, g, K.who(m.from), box.x + av * 0.42, y + bh - fs * 0.7, 0.3 * fs / 28, 'neutral', 1);
        y += bh;
        let meta = null;
        const metaTxt = [isClock(time) ? time : '', m.seen ? K.w.seen : ''].filter(Boolean).join(' · ');
        if (metaTxt) {
          meta = ctx.el('g', {}, g);
          const msz = Math.max(K.min, fs * 0.6), tick = m.seen && own ? fs * 1.15 : 0;
          const mt = ctx.text(meta, metaTxt, own ? box.x + box.w - tick : bx + 6, y + fs * 0.22, { font: 'mono', size: msz, color: m.seen ? 'accent' : 'muted', anchor: own ? 'end' : 'start', lines: 1, ls: 0.04 });
          if (tick) {
            const cx = box.x + box.w - fs * 0.45, cy = mt.top + mt.h / 2;
            ctx.el('path', { d: `M${r1(cx - 15)} ${r1(cy)}l5 6l10 -12M${r1(cx - 5)} ${r1(cy)}l5 6l10 -12`, stroke: t.accent, 'stroke-width': 2.8, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, meta);
          }
          y = mt.top + mt.h;
        }
        els.push({ g, meta, type: 'msg' });
        y += fs * 0.5;
      }
      return { els, h: y - box.y };
    }
  }

  function receiptBig(K, g, cx, top, w, ins, acc) {
    const { ctx, t } = K;
    const items = (Array.isArray(ins.items) ? ins.items : []).map(it => {
      if (it && typeof it === 'object') return { label: str(it.label || it.text), value: str(it.value), accent: !!it.accent };
      const s0 = str(it), m = s0.split(/\s+[·|–-]\s+|\t/);
      return { label: m[0], value: m.length > 1 ? m[m.length - 1] : '', accent: false };
    });
    const fs = Math.max(K.min + 4, w * 0.072), lh = fs * 1.75;
    const rowsN = items.length || 5;
    const h = fs * 4.2 + rowsN * lh + (ins.total ? fs * 3 : fs * 1.2);
    const x = cx - w / 2;
    const rg = ctx.el('g', { class: 'mo-receipt' }, g);
    let z = `M${r1(x)} ${r1(top)}H${r1(x + w)}V${r1(top + h)}`;
    const nz = Math.round(w / 26), st = w / nz;
    for (let k = 0; k < nz; k++) z += `L${r1(x + w - st * (k + 0.5))} ${r1(top + h + 14)}L${r1(x + w - st * (k + 1))} ${r1(top + h)}`;
    ctx.rough(ctx.el('path', { d: z + 'Z', fill: t.paper2, stroke: t.ink, 'stroke-width': 4, 'stroke-linejoin': 'round' }, rg), 1);
    ctx.text(rg, str(ins.title) || K.w.receipt, cx, top + fs * 0.9, { font: 'mono', size: fs * 1.05, weight: 500, anchor: 'middle', upper: true, ls: 0.14, lines: 1, maxW: w - fs * 2 });
    if (ins.label) ctx.text(rg, str(ins.label), cx, top + fs * 2.2, { font: 'mono', size: Math.max(K.min, fs * 0.66), color: 'muted', anchor: 'middle', lines: 1, maxW: w - fs * 2 });
    let y = top + fs * 3.6;
    ctx.el('path', { d: `M${r1(x + fs)} ${r1(y)}H${r1(x + w - fs)}`, stroke: t.muted, 'stroke-width': 2.6, 'stroke-dasharray': '7 9', fill: 'none' }, rg);
    const rows = [];
    y += fs * 0.8;
    if (items.length) items.forEach(it => {
      const rgp = ctx.el('g', {}, rg);
      const col = it.accent ? 'accent' : 'ink';
      ctx.text(rgp, it.label, x + fs, y, { font: 'mono', size: fs, color: col, lines: 1, maxW: w * 0.6 });
      if (it.value) ctx.text(rgp, it.value, x + w - fs, y, { font: 'mono', size: fs, color: col, anchor: 'end', lines: 1, maxW: w * 0.36 });
      rows.push(rgp); y += lh;
    });
    else for (let k = 0; k < 5; k++) { const p = ctx.el('path', { d: scribble(x + fs, y + fs * 0.5, w * 0.46, 3.5) + `M${r1(x + w - fs - w * 0.16)} ${r1(y + fs * 0.5)}h${r1(w * 0.16)}`, stroke: t.muted, 'stroke-width': 3.5, fill: 'none', 'stroke-linecap': 'round' }, rg); rows.push(p); y += lh; }
    let total = null;
    if (ins.total) {
      ctx.el('path', { d: `M${r1(x + fs)} ${r1(y + fs * 0.2)}H${r1(x + w - fs)}`, stroke: t.muted, 'stroke-width': 2.6, 'stroke-dasharray': '7 9', fill: 'none' }, rg);
      total = ctx.el('g', {}, rg);
      ctx.text(total, K.w.total, x + fs, y + fs * 1.1, { font: 'mono', size: fs, weight: 500, upper: true, ls: 0.1, lines: 1 });
      ctx.text(total, str(ins.total), x + w - fs, y + fs * 0.85, { font: 'hand', size: fs * 1.5, weight: 700, anchor: 'end', lines: 1, color: acc ? 'accent' : 'ink', maxW: w * 0.55 });
    }
    return { g: rg, rows, total, h: h + 14 };
  }

  /* --------------------------------------------------------------- shots */

  function shotWide(K, P, frame) {
    const inner = { x: P.x, y: P.y, w: P.w, h: P.h };
    const sc = scene(K, P.g, inner, { set: frame.set, people: frame.people, props: frame.props, highlight: frame.highlight }, { mode: 'wide' });
    if (!(Array.isArray(frame.people) && frame.people.length) && !(Array.isArray(frame.props) && frame.props.length)) K.ctx.issue('warn', 'wide shot with no people and no props');
    const bubbles = placeBubbles(K, P.top, sc.speakers, sc.heads, { soft: sc.soft });
    let at = bubbleBeats(K, bubbles, sc.end);
    sc.accentProps.forEach((x, k) => K.ctx.beat(x.e, 'pop', { at: at + 100 + k * 200 }));
  }

  function shotClose(K, P, frame) {
    const { ctx } = K;
    const ins = frame.insert && typeof frame.insert === 'object' ? frame.insert : null;
    const box = { x: P.x, y: P.y, w: P.w, h: P.h };
    let sc, end;
    if (ins) {
      // the face beside the thing it is looking at
      const tall = K.tall;
      // wide: face on the left, the thing on the right. tall: face above, the phone held low in front of the chest
      const pBox = tall ? { x: box.x, y: box.y, w: box.w, h: box.h * 0.5 } : { x: box.x, y: box.y, w: box.w * 0.46, h: box.h };
      const oBox = tall ? { x: box.x + box.w * 0.06, y: box.y + box.h * 0.4, w: box.w * 0.88, h: box.h * 0.6 } : { x: box.x + box.w * 0.46, y: box.y + 30, w: box.w * 0.5, h: box.h - 30 };
      let ppl = (Array.isArray(frame.people) ? frame.people : []).slice(0, 1);
      // tall: the big phone below *is* the one in their hands, so the hands drop out of shot
      if (tall && (ins.kind === 'phone' || ins.kind === 'chat' || !ins.kind)) ppl = ppl.map(p => (p && p.pose === 'phone' ? Object.assign({}, p, { pose: 'stand' }) : p));
      if ((frame.people || []).length > 1) ctx.issue('warn', 'close shot with an insert shows only the first person');
      sc = scene(K, P.g, pBox, { set: frame.set, people: ppl, props: [], highlight: frame.highlight }, { mode: 'close', side: tall ? 0.5 : 0.5 });
      const r = insertObject(K, P.g, oBox, frame, ins, { inClose: true, at: sc.end });
      end = r.end;
      const bubbles = placeBubbles(K, P.top, sc.speakers, sc.heads, { soft: [r.rect] });
      bubbleBeats(K, bubbles, end + 200);
      return;
    }
    if (!(Array.isArray(frame.people) && frame.people.length)) ctx.issue('warn', 'close shot without people');
    sc = scene(K, P.g, box, { set: frame.set, people: frame.people, props: frame.props, highlight: frame.highlight }, { mode: 'close' });
    const bubbles = placeBubbles(K, P.top, sc.speakers, sc.heads, { soft: sc.soft });
    const at = bubbleBeats(K, bubbles, sc.end);
    sc.accentProps.forEach((x, k) => ctx.beat(x.e, 'pop', { at: at + 100 + k * 200 }));
  }

  function shotInsert(K, P, frame) {
    const { ctx } = K;
    const ins = frame.insert && typeof frame.insert === 'object' ? frame.insert : {};
    const box = { x: P.x, y: P.y, w: P.w, h: P.h };
    // off-screen voices: people listed with "say" talk from outside the frame
    const voices = (Array.isArray(frame.people) ? frame.people : []).filter(p => p && (p.say || p.think));
    const tall = K.tall;
    let oBox;
    if (tall) oBox = voices.length ? { x: box.x + 40, y: box.y + box.h * 0.26, w: box.w - 80, h: box.h * 0.74 } : { x: box.x + 40, y: box.y + 40, w: box.w - 80, h: box.h - 40 };
    else oBox = { x: box.x + box.w * 0.3, y: box.y + 34, w: box.w * 0.4, h: box.h - 34 };
    const r = insertObject(K, P.g, oBox, frame, ins, { at: 120 });
    if (voices.length) {
      const sp = [], heads = [];
      voices.forEach((v, k) => {
        const info = K.who(v.who);
        const left = tall ? k % 2 === 0 : k % 2 === 0;
        const hs = tall ? 1.05 : 0.95;
        const hx = left ? box.x + 30 * hs : box.x + box.w - 30 * hs;
        const hy = tall ? box.y + 130 + k * 0 : box.y + box.h * (0.3 + 0.22 * Math.floor(k / 2));
        const hg = head(K, P.g, info, hx, tall ? hy + (k % 2) * 40 : hy, hs, MOODS.includes(v.mood) ? v.mood : 'neutral', left ? 1 : -1);
        ctx.beat(hg, 'fade', { at: r.end + k * 300, dx: left ? -20 : 20, dy: 0 });
        const vb = tall ? { x: box.x + 90, y: box.y + 10, w: box.w - 180, h: box.h * 0.27 } : left ? { x: box.x + 70, y: box.y + 20, w: oBox.x - box.x - 80, h: box.h - 40 } : { x: oBox.x + oBox.w + 10, y: box.y + 20, w: box.x + box.w - oBox.x - oBox.w - 80, h: box.h - 40 };
        sp.push({ x: hx, y: tall ? hy + (k % 2) * 40 : hy, r: 56 * hs, f: left ? 1 : -1, say: str(v.say), think: str(v.think), box: vb });
        heads.push({ x: hx, y: hy, r: 60 * hs, top: hy - 70 * hs });
      });
      const bubbles = placeBubbles(K, P.top, sp, heads, { soft: [r.rect] });
      bubbleBeats(K, bubbles, r.end + 300);
    }
  }

  // phone (ui) | chat | receipt | any prop, filling `oBox`
  function insertObject(K, parent, oBox, frame, ins, o) {
    const { ctx, t } = K;
    const kind = ins.kind || 'phone';
    const at0 = o.at || 0;
    const g = ctx.el('g', { class: 'mo-insert' }, parent);
    const cx = oBox.x + oBox.w / 2;
    const bottom = oBox.y + oBox.h;
    const acc = ins.accent === true;
    if (kind === 'phone' || kind === 'chat') {
      const msgs = Array.isArray(ins.messages) ? ins.messages : [];
      const owner = ownerOf(K, frame, kind === 'chat' ? msgs : null);
      const pw = Math.min(oBox.w * (K.tall ? 0.86 : 1), kind === 'chat' ? (K.tall ? 660 : 560) : (K.tall ? 600 : 470));
      const ph = pw * 2.05;
      const scr = phoneBody(K, g, cx, oBox.y, pw, ph, acc, bottom + (o.inClose ? 18 : K.tall ? 12 : 16));
      const visH = Math.min(scr.h, bottom - scr.y - 20);
      const k = pw / 380;
      let els = [];
      if (kind === 'chat') {
        // header: who this thread is with
        const others = [...new Set(msgs.map(m => m && m.from).filter(f => f && (!owner || f !== owner.id)))];
        const castOthers = others.length ? others : [...K.cast.keys()].filter(id => !owner || id !== owner.id).slice(0, 3);
        const hdr = ctx.el('g', {}, g);
        const hy = scr.y + 34 * k;
        castOthers.slice(0, 4).forEach((id, j) => head(K, hdr, K.who(id), scr.x + 40 * k + j * 40 * k, hy, 0.34 * k, 'neutral', 1));
        const title = str(ins.title) || castOthers.map(id => K.who(id).name).join(', ');
        const tx0 = scr.x + 40 * k + Math.min(4, castOthers.length) * 40 * k + 10 * k;
        ctx.text(hdr, title, tx0, hy, { font: 'hand', size: Math.max(K.min, 28 * k), weight: 600, valign: 'middle', lines: 1, maxW: scr.x + scr.w - tx0 - 16 * k, minSize: K.min });
        ctx.el('path', { d: `M${r1(scr.x)} ${r1(hy + 40 * k)}H${r1(scr.x + scr.w)}`, stroke: t.line, 'stroke-width': 2.4, fill: 'none' }, hdr);
        ctx.beat(hdr, 'fade', { at: at0 + 100, dy: 0 });
        els = chatUI(K, g, msgs, { x: scr.x + 22 * k, y: hy + 64 * k, w: scr.w - 44 * k, h: visH - (hy + 64 * k - scr.y) - 10 }, owner, k);
        let at = at0 + 500;
        els.forEach(e => {
          if (e.type === 'day') { ctx.beat(e.g, 'fade', { at, dy: 0, dur: 400 }); at += 260; return; }
          ctx.beat(e.g, 'fade', { at, dy: 22, dur: 480 });
          if (e.meta) ctx.beat(e.meta, 'fade', { at: at + 600, dy: 0, dur: 420 });
          at += e.meta ? 1000 : 680;
        });
        o.end = at;
      } else {
        const ui = Array.isArray(ins.screen) ? ins.screen : [];
        if (!ui.length) ctx.issue('warn', 'phone insert without a "screen" ui list; the screen is blank');
        // shrink the whole screen until every item fits (down to legibility), then report what was cut
        let r, got, kk = k;
        for (let a = 0; a < 8; a++) {
          [r, got] = quietly(ctx, () => screenUI(K, g, ui, { x: scr.x, y: scr.y, w: scr.w, h: visH }, kk));
          if (!r.cut || kk * 0.9 * 22 < K.min) break;
          r.g.remove(); kk *= 0.9;
        }
        got.forEach(([l, m]) => ctx.issue(l, m));
        r.els.forEach((e, j) => ctx.beat(e, 'fade', { at: at0 + 300 + j * 170, dy: 10 }));
        o.end = at0 + 300 + r.els.length * 170 + 300;
      }
      if (!o.inClose) holdingHand(K, g, { x: cx - pw / 2, y: oBox.y, w: pw, h: ph }, sleeveOf(K, owner, frame), bottom);
      ctx.beat(scr.body, 'fade', { at: at0, dy: 30, dur: 600 });
      if (!o.inClose) g.setAttribute('transform', `rotate(${K.tall ? -2 : -2.5} ${r1(cx)} ${r1(bottom)})`);   // held in a hand, not pasted flat
      return { end: o.end, rect: { x0: cx - pw / 2, x1: cx + pw / 2, y0: oBox.y, y1: bottom } };
    }
    if (kind === 'receipt') {
      // size the paper so it fills the frame height (fs = 7.2% of the width drives every row)
      const nRows = Array.isArray(ins.items) && ins.items.length ? ins.items.length : 5;
      const perW = 0.072 * (4.2 + nRows * 1.75 + (ins.total ? 3 : 1.2));
      const w = Math.min(oBox.w * 0.9, (oBox.h * 0.9 - 40) / perW, K.tall ? 720 : 640);
      const estH = w * perW + 14, top = oBox.y + Math.max(20, (oBox.h - estH) / 2 - 10);
      const rr = receiptBig(K, g, cx, top, w, ins, acc || frame.highlight != null);
      const fit = Math.min(1, (oBox.y + oBox.h - top - 10) / rr.h);
      if (fit < 1) { rr.g.setAttribute('transform', `translate(${r1(cx)} ${r1(top)}) scale(${r2(fit)}) translate(${r1(-cx)} ${r1(-top)})`); if (fit < 0.75) ctx.issue('warn', 'receipt has too many items; it is drawn small'); }
      else rr.g.setAttribute('transform', `rotate(-2 ${r1(cx)} ${r1(top + rr.h / 2)})`);
      ctx.beat(rr.g, 'fade', { at: at0, dy: 30, dur: 600 });
      rr.rows.forEach((e, j) => ctx.beat(e, 'fade', { at: at0 + 400 + j * 140, dy: 0, dur: 360 }));
      let end = at0 + 400 + rr.rows.length * 140;
      if (rr.total) { ctx.beat(rr.total, 'pop', { at: end + 200 }); end += 700; }
      return { end, rect: { x0: cx - w / 2, x1: cx + w / 2, y0: top, y1: top + rr.h * fit } };
    }
    if (!PROPS.includes(kind)) ctx.issue('warn', `unknown insert kind "${kind}" (phone | chat | receipt | a prop kind)`);
    const pk = PROPS.includes(kind) ? kind : 'box';
    const ph0 = PROP_H[pk] || 120, pw0 = { food: 216, car: 270, store: 240, whiteboard: 300, chart: 210, money: 190, laptop: 176, letter: 130 }[pk] || 140;
    const s = Math.min((oBox.h * 0.72) / ph0, (oBox.w * 0.8) / pw0, 4.2);
    const y = oBox.y + oBox.h * 0.5 + ph0 * s * 0.5;
    const e = prop(K, g, Object.assign({}, ins, { kind: pk, label: pk === 'whiteboard' ? ins.label : null, time: ins.time || ins.label }), cx, y, s, ins.accent !== false);
    ctx.beat(e, 'pop', { at: at0 + 100, dur: 600 });
    if (ins.label && pk !== 'whiteboard') {
      const lab = ctx.text(g, str(ins.label), cx, y + 26, { font: 'hand', size: K.tall ? 40 : 34, weight: 600, anchor: 'middle', maxW: oBox.w, lines: 2 });

 *    each render only decides what is visible and what arrives.

      if (n.lbox && segsOf(pl).some(s => ov(segBox(s, 2), n.lbox) > 0)) ctx.issue('warn', `flow ${pl.f.from} → ${pl.f.to} crosses the label of "${n.id}"; move one of them on the grid`);
    }));

    /* ---- flow labels + value pills: first spot along the route that hits nothing ---- */

    const placed = [];
    const markR = Z.mark;
    plans.forEach(pl => {
      const f = pl.f, label = f.label != null && f.label !== '' ? String(f.label) : '', value = f.value != null && f.value !== '' ? String(f.value) : '';
      const proof = proofOf(f);
      if (!label && !value && !proof) return;
      const pw = value ? ctx.measure(value, FN.pill) + Z.pill * 1.15 : 0, ph = value ? Z.pill * 1.7 : 0;
      const segs = segsOf(pl), lens = segs.map(s => Math.hypot(s.b[0] - s.a[0], s.b[1] - s.a[1])), maxLen = Math.max(...lens);
      const longWord = label ? Math.max(...ctx.plain(label).split(/\s+/).map(x => ctx.measure(x, FN.lab))) + 2 : 0;
      let best = null;
      segs.forEach((s, si) => {
        const len = lens[si], horiz = Math.abs(s.a[1] - s.b[1]) < 0.5;

        const tw0 = clamp(Math.max(horiz ? len - 40 : (tall ? 230 : 250) * Z.u, longWord), 150 * Z.u, 320 * Z.u);
        const T = label ? est(ctx, label, FN.lab, tw0, 2) : { w: 0, h: 0 };
        const mw = proof ? markR * 2 + 8 : 0;
        for (const tt of [0.5, 0.36, 0.64, 0.22, 0.78]) {
          const P = [s.a[0] + (s.b[0] - s.a[0]) * tt, s.a[1] + (s.b[1] - s.a[1]) * tt];
          // on a vertical line a wide pill would cover a parallel neighbour, so it may also sit beside the line
          for (const [side, beside] of [[0, false], [1, false], ...(!horiz && value ? [[0, true], [1, true]] : [])]) {
            const c = { si, tt, side, P, horiz, maxW: tw0, T, mw, pw, ph };
            const parts = [];
            const pdx = beside ? (side ? -1 : 1) * (pl.sw / 2 + 12 + pw / 2) : 0;
            if (value) parts.push(c.pill = { x0: P[0] + pdx - pw / 2, y0: P[1] - ph / 2, x1: P[0] + pdx + pw / 2, y1: P[1] + ph / 2 });
            if (label || proof) {
              const tw = T.w + mw, th = Math.max(T.h, proof ? markR * 2 : 0);
              if (horiz) {
                const off = (value ? ph / 2 : pl.sw / 2) + 8;
                c.text = side ? { x0: P[0] - tw / 2, y0: P[1] + off, x1: P[0] + tw / 2, y1: P[1] + off + th } : { x0: P[0] - tw / 2, y0: P[1] - off - th, x1: P[0] + tw / 2, y1: P[1] - off };
              } else {
                const off = (value ? (beside ? pl.sw / 2 + 12 + pw + 10 : pw / 2 + 14) : pl.sw / 2 + 14);
                c.text = side ? { x0: P[0] - off - tw, y0: P[1] - th / 2, x1: P[0] - off, y1: P[1] + th / 2 } : { x0: P[0] + off, y0: P[1] - th / 2, x1: P[0] + off + tw, y1: P[1] + th / 2 };
              }
              parts.push(c.text);
            }
            // value pill must sit on the straight part of its segment
            let score = (1 - len / maxLen) * 30 + Math.abs(tt - 0.5) * 40 + side * 4 + (beside ? 12 : 0);
            if (value && Math.min(tt, 1 - tt) * len < (horiz ? pw : ph) / 2 + Z.r) score += 400;
            for (const p of parts) {
              for (const b of boxes) score += ov(p, b);
              for (const q of placed) score += ov(p, q) * 2;
              lines.forEach((ls, li) => ls.forEach(l => { if (plans[li] !== pl || p === c.text) score += ov(p, l.box) * (plans[li] === pl ? 0.6 : 1.5); }));
              score += Math.max(0, A.x0 - 40 - p.x0, p.x1 - A.x1 - 40, A.y0 - 20 - p.y0, p.y1 - A.y1 - 20) * 8;

      if (!best) return;
      pl.lab = Object.assign(best, { label, value, proof });
      if (best.pill) placed.push(best.pill);
      if (best.text) placed.push(best.text);
      if (best.score > 600) ctx.issue('warn', `flow ${f.from} → ${f.to}: no clear spot for its label; it overlaps something`);
    });

    /* ---- camera: the layout is the union (stable), the framing fits what this frame shows ---- */
    // what is on screen in Cx for the given states: actors + their labels, flow lines + their labels
    // With frame index k: when that frame fades many actors (focus), frame only its new part (+ focus) and the
    // actors joined to it; older faded parts may crop at the stage edges (bb.crop)
    const frameBox = (Cx, sts, k) => {
      const bb = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity, crop: false };
      const grow = b => { if (!b) return; bb.x0 = Math.min(bb.x0, b.x0); bb.y0 = Math.min(bb.y0, b.y0); bb.x1 = Math.max(bb.x1, b.x1); bb.y1 = Math.max(bb.y1, b.y1); };
      const fl = Cx.flows.filter(x => sts.some(st => vF(Cx, x, st))), keys = new Set(fl.map(x => x.key));
      const vis = [...nodes.keys()].filter(id => sts.some(st => vA(Cx, id, st)));
      const fo = k == null ? new Set() : new Set(arr(F[k].focus).map(String).filter(id => nodes.has(id)));
      let keep = null;
      if (fo.size && vis.filter(id => !fo.has(id)).length >= 3) {
        const core = new Set([...fo, ...vis.filter(id => Cx.actors.get(id)._k === k)]);
        fl.forEach(x => { if (x._k === k) { core.add(x.from); core.add(x.to); } });
        keep = new Set(core);
        fl.forEach(x => { if (core.has(x.from)) keep.add(x.to); if (core.has(x.to)) keep.add(x.from); });
        bb.crop = keep.size < vis.length;
      }
      const kept = id => !keep || keep.has(id);
      nodes.forEach(n => { if (vis.includes(n.id) && kept(n.id)) { grow(n.box); grow(n.lbox); } });
      plans.forEach((pl, i) => {
        if (keys.has(pl.f.key) && kept(pl.f.from) && kept(pl.f.to)) { lines[i].forEach(l => grow(l.box)); if (pl.lab) { grow(pl.lab.pill); grow(pl.lab.text); } }
      });
      return isFinite(bb.x0) ? bb : null;
    };
    // fit + centre; inside a continue chain the camera may come closer (type up to ~1.6× its base size)
    const cap = group.length > 1 ? 1.6 / Z.u : 1.12;
    const cam = bb => {
      const s = Math.min(cap, (A.x1 - A.x0) / (bb.x1 - bb.x0), (A.y1 - A.y0) / (bb.y1 - bb.y0));
      return { bb, s, tx: (A.x0 + A.x1) / 2 - s * (bb.x0 + bb.x1) / 2, ty: (A.y0 + A.y1) / 2 - s * (bb.y0 + bb.y1) / 2 };
    };
    const both = ['after', 'before'];
    const sts0 = frame.compare ? both : [state];
    const K = cam(frameBox(C, sts0, ctx.index) || frameBox(U, both));
    const { bb, s, tx, ty } = K;
    if (s < 0.84) ctx.issue('warn', `diagram is crowded (scaled to ${Math.round(s * 100)}%); use fewer actors or shorter labels`);
    const defs = ctx.el('defs', {}, ctx.stage);
    let host = ctx.stage;
    if (bb.crop) {   // a window below the legend; the faded parts cut off fade out at the sides they leave by
      const H = ctx.H, top = Math.max(0, ty + s * bb.y0 - (tall ? 22 : 18)), fb = frameBox(C, sts0);
      const o = { x0: tx + s * fb.x0, y0: ty + s * fb.y0, x1: tx + s * fb.x1, y1: ty + s * fb.y1 }, e = 26, far = 400;
      host = ctx.el('svg', { x: 0, y: r1(top), width: W, height: r1(H - top), viewBox: `0 ${r1(top)} ${W} ${r1(H - top)}`, overflow: 'hidden', 'data-crop': 1 }, ctx.stage);
      const fid = ctx.id('flow-cropf'), mid = ctx.id('flow-crop');
      ctx.el('feGaussianBlur', { stdDeviation: 12 }, ctx.el('filter', { id: fid, x: -far, y: -far, width: W + 2 * far, height: H + 2 * far, filterUnits: 'userSpaceOnUse' }, defs));
      const m = ctx.el('mask', { id: mid, maskUnits: 'userSpaceOnUse', x: -far, y: -far, width: W + 2 * far, height: H + 2 * far }, defs);
      const x0 = o.x0 < 0 ? e : -far, x1 = o.x1 > W ? W - e : W + far, y0 = o.y0 < top ? top + e : -far, y1 = o.y1 > H ? H - e : H + far;
      ctx.el('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: '#fff', filter: `url(#${fid})` }, m);
      host = ctx.el('g', { mask: `url(#${mid})` }, host);
    }
    const root = ctx.el('g', { class: 'flow', transform: `translate(${r1(tx)} ${r1(ty)})${s !== 1 ? ` scale(${s.toFixed(4)})` : ''}` }, host);
    const gLines = ctx.el('g', {}, root), gActors = ctx.el('g', {}, root), gLabels = ctx.el('g', {}, root);
    leg.place(tx + s * bb.x0, tx + s * bb.x1, ty + s * bb.y0);
    // a continue frame starts at the previous frame's framing and glides to this one (seekable; ends natural)
    let camMs = 0;
    if (chain.length > 1 && !toggle) {
      const pk = chain[chain.length - 2], pb = frameBox(collect(ctx, F, chain.slice(0, -1), false), F[pk].compare ? both : ['after'], pk);
      const P = pb && cam(pb), k = P ? P.s / s : 1;
      if (P && (Math.abs(k - 1) > 0.004 || Math.hypot(P.tx - tx, P.ty - ty) > 1)) {

        const a = ctx.anim(root, [{ transform: `translate(${r1(P.tx - k * tx)}px,${r1(P.ty - k * ty)}px) scale(${k.toFixed(4)})` }, { transform: 'translate(0px,0px) scale(1)' }],

      }
    }

    const focus = new Set(arr(frame.focus).map(String).filter(id => { if (!nodes.has(id)) ctx.issue('warn', `focus "${id}" is not an actor`); return nodes.has(id); }));
    const opA = id => (focus.size && !focus.has(id) ? 0.22 : 1);
    const opF = f => (!focus.size ? 1 : focus.size === 1 ? (focus.has(f.from) || focus.has(f.to) ? 1 : 0.22) : (focus.has(f.from) && focus.has(f.to) ? 1 : 0.22));

    /* ---- draw + motion ---- */
    const halo = (o, size) => { o.el.setAttribute('stroke', t.paper); o.el.setAttribute('stroke-width', r1(size * 0.32)); o.el.setAttribute('stroke-linejoin', 'round'); o.el.setAttribute('paint-order', 'stroke'); return o; };
    const enterA = [], leaveEls = [];
    nodes.forEach(n => {
      const a = C.actors.get(n.id);
      const m = a ? mode(a, (x, st) => visA(x.id, st)) : null;
      if (!m) return;
      const g = ctx.el('g', { class: 'flow-actor' }, gActors);
      if (a.code) ctx.el('title', {}, g).textContent = codeRef(a.code);
      const parts = n.group ? drawGroup(ctx, g, n, Z, FN) : drawActor(ctx, g, n, a, Z, FN, halo);
      const op = opA(n.id);
      if (m === 'leave') { g.setAttribute('opacity', 0); leaveEls.push([g, op]); }
      else if (m === 'enter') enterA.push({ n, g, op, parts });
      else if (op < 1) g.setAttribute('opacity', op);
    });

    const enterF = [];
    plans.forEach(pl => {
      const x = C.flows.find(c => c.key === pl.f.key);
      const m = x ? mode(x, visF) : null;
      if (!m) return;
      // out of focus = faded ink (not opacity), so value pills still cover the line under them
      const accent = accentOf(x), op = opF(x), dim = op < 1 ? c => mix(c, t.paper, 0.72) : c => c, color = dim(accent ? t.accent : t.ink);
      const ln = drawLine(ctx, gLines, pl.pts, x.type, color, Z);
      const lab = pl.lab ? drawLabel(ctx, gLabels, pl, x, color, accent, Z, FN, markR, w, halo, dim) : null;
      const els = [ln.g, lab && lab.g].filter(Boolean);
      if (m === 'leave') els.forEach(e => { e.setAttribute('opacity', 0); leaveEls.push([e, 1]); });
      else if (m === 'enter') enterF.push({ pl, ln, lab, accent });
    });

    // motion: leave first (toggle), then actors in reading order, then flows one by one, accent last
    leaveEls.forEach(([e, op]) => ctx.anim(e, [{ opacity: op }, { opacity: 0 }], { at: 0, duration: 420, easing: 'ease-in' }));
    const base = (toggle ? 260 : 120) + camMs * 0.5, stepA = toggle ? 90 : 110;
    enterA.sort((p, q) => (tall ? p.n.y - q.n.y || p.n.x - q.n.x : p.n.x - q.n.x || p.n.y - q.n.y));
    enterA.forEach(({ n, g, op, parts }, k) => {
      const at = base + k * stepA;
      if (n.group) {
        ctx.beat(parts.box, 'draw', { at, dur: 900 });
        ctx.beat(parts.tab, 'fade', { at: at + 300, dy: 0 });
        parts.members.forEach((e, j) => ctx.beat(e, 'pop', { at: at + 260 + j * 90 }));
        if (op < 1) g.setAttribute('opacity', op);
      } else ctx.beat(g, 'fade', { at, dur: 600, dy: 10, to: op < 1 ? op : null });

    let tf = enterA.length ? base + (enterA.length - 1) * stepA + (toggle ? 380 : 520) : (toggle ? 420 : 200) + camMs * 0.6;
    const order = enterF.filter(e => !e.accent).concat(enterF.filter(e => e.accent));
    const stagger = clamp(3200 / Math.max(1, order.length), 380, 640);
    order.forEach((e, k) => {
      if (e.accent && k > 0 && !order[k - 1].accent) tf += 300;   // a beat of quiet before the new thing
      const dur = clamp(e.ln.len * 0.8, 520, 1150);
      animateFlow(ctx, defs, e, tf, dur);
      tf += e.accent ? Math.max(stagger, dur * 0.7) : stagger;
    });
    if (!toggle && !C.inherited) ctx.beat(leg.g, 'fade', { at: 60, dy: 0 });
  }

  /* ---------- data ---------- */

  // frames that make up this diagram: chain = base … this frame; group = base … last frame that continues it
  function chainOf(ctx, F) {
    const isFlow = f => f && f.lens === 'flow';
    const chain = [ctx.index];
    while (F[chain[0]].continue) {
      let k = chain[0] - 1;
      while (k >= 0 && !isFlow(F[k])) k--;
      if (k < 0) { ctx.issue('warn', '"continue": true but there is no earlier flow frame'); break; }
      chain.unshift(k);
    }
    const group = chain.slice();
    for (let k = ctx.index + 1; k < F.length; k++) { if (!isFlow(F[k])) continue; if (!F[k].continue) break; group.push(k); }
    return { chain, group };
  }

  function collect(ctx, F, idxs, report) {
    const actors = new Map(), flows = new Map();
    const say = (msg) => { if (report) ctx.issue('warn', msg); };
    for (const k of idxs) {
      const f = F[k];
      for (const a of arr(f.actors)) {
        if (!a || a.id == null) { say('actor without an "id"'); continue; }
        const id = String(a.id), old = actors.get(id);
        actors.set(id, Object.assign({}, old, a, { id, _k: old ? old._k : k }));
      }
      for (const x of arr(f.flows)) {
        if (!x || x.from == null || x.to == null) { say('flow needs "from" and "to"'); continue; }
        const key = x.id != null ? 'id:' + x.id : `${x.from}>${x.to}|${x.type || ''}|${ctx.plain(String(x.label || ''))}`;
        const old = flows.get(key);
        flows.set(key, Object.assign({}, old, x, { key, from: String(x.from), to: String(x.to), _k: old ? old._k : k, _newAt: x.new ? k : undefined }));
      }
    }
    for (const x of flows.values()) {
      if (!STYLE[x.type]) { if (x.type != null) say(`unknown flow type "${x.type}" (${TYPES.join(' | ')}); drawn as info`); x.type = 'info'; }
      for (const e of ['from', 'to']) if (!actors.has(x[e])) say(`flow ${e} "${x[e]}" is not an actor`);
      if (x.from === x.to) say(`flow ${x.from} → ${x.to} points at itself; skipped`);
    }
    return { actors, flows: [...flows.values()], inherited: idxs.length > 1 };
  }

  function placeCells(ctx, actors) {
    const cells = new Map(), taken = new Set(), list = [...actors.values()];
    const ok = a => Array.isArray(a.at) && a.at.length === 2 && a.at.every(Number.isFinite);
    list.filter(ok).forEach(a => { const c = [Math.round(a.at[0]), Math.round(a.at[1])]; cells.set(a.id, c); taken.add(c.join(',')); });
    const rest = list.filter(a => !ok(a));
    if (rest.length && !cells.size) {   // nobody placed: one calm row (or a few)
      const rows = Math.ceil(rest.length / 4), per = Math.ceil(rest.length / rows);
      rest.forEach((a, k) => cells.set(a.id, [k % per, Math.floor(k / per)]));
    } else {
      for (const a of rest) {
        let spot = null;
        for (let r = 0; r < 3 && !spot; r++) for (let c = 0; c < 4 && !spot; c++) if (!taken.has(c + ',' + r)) spot = [c, r];
        if (!spot) { spot = [taken.size % 4, 3]; ctx.issue('warn', `no free grid cell for actor "${a.id}"`); }
        taken.add(spot.join(',')); cells.set(a.id, spot);
      }
    }
    return cells;
  }

  function membersOf(ctx, a) {
    const cast = ctx.story.cast || [];
    return arr(a.members).map(m => (typeof m === 'string' ? ((cast.find(c => c.id === m) || {}).name || m) : m && (m.name || m.id) ? String(m.name || m.id) : '?'));
  }

  function proofOf(f) {
    if (f.proof && f.proof.status) return f.proof;
    if (typeof f.inferred === 'string' && f.inferred.trim()) return { status: 'inferred', why: f.inferred };   // dev page, no build
    return null;
  }
  const codeRef = c => (typeof c === 'string' ? c : c && c.file ? c.file + (c.start ? `:${c.start}-${c.end}` : '') : '');

  // greedy wrap estimate with the same fonts core uses (layout runs before anything is drawn)
  function est(ctx, str, o, maxW, maxLines) {
    const words = ctx.plain(String(str == null ? '' : str)).split(/\s+/).filter(Boolean);
    if (!words.length) return { w: 0, h: 0, n: 0 };
    const m = x => ctx.measure(x, o), out = [];
    let cur = '';
    for (const wd of words) { const t2 = cur ? cur + ' ' + wd : wd; if (cur && m(t2) > maxW) { out.push(cur); cur = wd; } else cur = t2; }
    out.push(cur);
    const n = Math.min(out.length, maxLines);
    return { w: Math.min(maxW, Math.max(...out.slice(0, n).map(m))), h: n * o.size * o.lh, n };
  }

  function groupGeom(ctx, a, mem, Z, ms = 1) {
    const n = mem.length, slots = Math.min(n, 6), show = n > 6 ? 5 : n;
    const cols = slots <= 3 ? slots : slots === 4 ? 2 : 3, rows = Math.ceil(slots / cols);
    const memS = Z.memS * ms, memF = Z.mem * Math.min(ms, 1.2), cw = Z.cw * ms, chh = memS + memF * 1.1 + 30 * Z.u;
    const tabStr = String((a.label || a.id) + (a.sub ? ' · ' + a.sub : '')).toLocaleUpperCase(ctx.lang);
    const tabW = ctx.measure(tabStr, { font: 'mono', size: Z.tab, weight: 500, ls: 0.12 });
    const top = Z.tab * 0.6 + 34 * Z.u, bottom = 22 * Z.u;
    const bw = Math.max(cols * cw + 52 * Z.u, tabW + 90 * Z.u), bh = rows * chh + top + bottom;
    return { group: true, memS, memF, cols, rows, cw, chh, bw, bh, top, tabStr, tabW, show, more: n - show, fw: bw, fh: bh + Z.tab };
  }

  /* ---------- drawing ---------- */

  function picto(ctx, parent, kind, cx, cy, size) {
    const src = PICTO[kind];
    if (!src) return ctx.icon(parent, kind || 'person', cx, cy, size, { sw: 3 });   // core icon set; warns if unknown
    const g = ctx.el('g', { transform: `translate(${r1(cx - size / 2)} ${r1(cy - size / 2)}) scale(${(size / 48).toFixed(4)})` }, parent);
    g.innerHTML = src.replace(/="K"/g, `="${ctx.t.ink}"`).replace(/="P"/g, `="${ctx.t.paper}"`);
    return ctx.rough(g, 1);
  }

  function drawActor(ctx, g, n, a, Z, FN, halo) {
    const kind = PICTO[a.kind] || CORE_ICONS.has(a.kind) ? a.kind : 'person';
    if (a.kind != null && kind !== a.kind) ctx.issue('warn', `unknown actor kind "${a.kind}"; drawn as person`);
    picto(ctx, g, kind, n.x, n.y, Z.S);
    const name = a.label != null ? a.label : a.id, b = n.lbox, anchor = n.anchor, x = n.lx;
    const nm = halo(ctx.rich(g, name, x, b.y0, Object.assign({}, FN.name, { anchor, maxW: n.maxW, lines: 2, minSize: FN.name.size * 0.8 })), Z.name);
    if (a.sub) halo(ctx.rich(g, a.sub, x, nm.top + nm.h + 4, Object.assign({}, FN.sub, { anchor, maxW: n.maxW, lines: 2, color: 'ink2', minSize: FN.sub.size * 0.8 })), Z.sub);
    return {};
  }

  function drawGroup(ctx, g, n, Z, FN) {
    const t = ctx.t, x0 = n.x - n.bw / 2, y0 = n.y - n.bh / 2;
    const box = ctx.rough(ctx.el('rect', { x: r1(x0), y: r1(y0), width: r1(n.bw), height: r1(n.bh), rx: 24, fill: 'none', stroke: t.ink, 'stroke-width': 2.6 }, g), 1);
    const tab = ctx.el('g', {}, g), tx = x0 + 30, tyy = n.tabBottom ? y0 + n.bh : y0;
    ctx.el('rect', { x: r1(tx - 12), y: r1(tyy - Z.tab * 0.75), width: r1(n.tabW + 24), height: r1(Z.tab * 1.5), fill: t.paper }, tab);
    ctx.text(tab, n.tabStr, tx, tyy, { font: 'mono', size: Z.tab, weight: 500, ls: 0.12, color: 'ink2', valign: 'middle', lines: 1, lh: 1 });
    const members = [];
    const slots = n.show + (n.more ? 1 : 0);
    for (let k = 0; k < slots; k++) {
      const row = Math.floor(k / n.cols), inRow = Math.min(n.cols, slots - row * n.cols), col = k % n.cols;
      const cx = n.x + (col - (inRow - 1) / 2) * n.cw, cy = n.y + (row - (n.rows - 1) / 2) * n.chh - (8 * Z.u + n.memF * 1.1) / 2 + (n.tabBottom ? -1 : 1) * Z.tab * 0.3;
      const mg = ctx.el('g', {}, g);
      if (k < n.show) {
        picto(ctx, mg, 'person', cx, cy, n.memS);
        ctx.text(mg, n.members[k], cx, cy + n.memS / 2 + 8 * Z.u, Object.assign({}, FN.mem, { size: n.memF, anchor: 'middle', maxW: n.cw - 14, lines: 1 }));
      } else {
        ctx.el('circle', { cx: r1(cx), cy: r1(cy), r: n.memS * 0.42, fill: 'none', stroke: t.ink2, 'stroke-width': 2.6 }, mg);
        ctx.text(mg, '+' + n.more, cx, cy, { font: 'mono', size: n.memF, weight: 500, anchor: 'middle', valign: 'middle', color: 'ink2', lh: 1 });
      }
      members.push(mg);

  }

  // orthogonal polyline with rounded corners; with `rnd`, each straight run bows a hair (seeded), the
  // hand-drawn line without the wobble filter (which breaks thin and dashed strokes)
  function roundPath(pts, r, rnd) {
    let d = `M${pts[0][0]} ${pts[0][1]}`, cur = pts[0];
    const run = (x, y) => {
      const len = Math.hypot(x - cur[0], y - cur[1]);
      if (rnd && len > 40) {
        const j = (rnd() - 0.5) * 2 * Math.min(2.4, len * 0.008), nx = -(y - cur[1]) / len, ny = (x - cur[0]) / len;
        d += ` Q${r1((cur[0] + x) / 2 + nx * j)} ${r1((cur[1] + y) / 2 + ny * j)} ${r1(x)} ${r1(y)}`;
      } else d += ` L${r1(x)} ${r1(y)}`;
      cur = [x, y];
    };
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, l1 / 2, l2 / 2);
      run(x1 - (x1 - x0) / l1 * rr, y1 - (y1 - y0) / l1 * rr);
      const e = [x1 + (x2 - x1) / l2 * rr, y1 + (y2 - y1) / l2 * rr];
      d += ` Q${x1} ${y1} ${r1(e[0])} ${r1(e[1])}`;
      cur = e;
    }
    const p = pts[pts.length - 1];
    run(p[0], p[1]);
    return d;
  }

  // one typed line: body (masked so it can be drawn on), head, optional tail dot
  function drawLine(ctx, parent, pts, type, color, Z, opt = {}) {
    const st = STYLE[type], k = Z.k, sw = st.w * k, hl = st.hl * k, hw = st.hw * k, t = ctx.t;
    const n = pts.length, tip = pts[n - 1], prev = pts[n - 2];
    const L0 = Math.hypot(tip[0] - prev[0], tip[1] - prev[1]) || 1, dir = [(tip[0] - prev[0]) / L0, (tip[1] - prev[1]) / L0];
    const trim = Math.min(L0 * 0.6, st.head === 'open' ? sw * 0.5 : hl * 0.85);
    const body = pts.map(p => p.slice());
    body[n - 1] = [tip[0] - dir[0] * trim, tip[1] - dir[1] * trim];
    const d = roundPath(body, opt.r != null ? opt.r : Z.r, opt.flat ? null : ctx.rand('flow-' + type + pts.flat().join(',')));
    const g = ctx.el('g', { class: 'flow-line flow-' + type }, parent);
    const lineG = ctx.el('g', {}, g);
    ctx.el('path', { d, fill: 'none', stroke: color, 'stroke-width': r1(sw), 'stroke-linecap': st.dash ? 'round' : 'butt', 'stroke-linejoin': 'round',
      'stroke-dasharray': st.dash ? st.dash.map(v => r1(v * k)).join(' ') : null }, lineG);
    if (st.inner) ctx.el('path', { d, fill: 'none', stroke: t.paper, 'stroke-width': r1(st.inner * k), 'stroke-linejoin': 'round' }, lineG);
    const nx = -dir[1], ny = dir[0], bx = tip[0] - dir[0] * hl, by = tip[1] - dir[1] * hl;
    const P1 = `${r1(bx + nx * hw)} ${r1(by + ny * hw)}`, P2 = `${r1(bx - nx * hw)} ${r1(by - ny * hw)}`, T = `${r1(tip[0])} ${r1(tip[1])}`;
    const head = st.head === 'open'
      ? ctx.el('path', { d: `M${P1}L${T}L${P2}`, fill: 'none', stroke: color, 'stroke-width': r1(Math.max(sw, 2.8 * k)), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g)
      : ctx.el('path', { d: `M${T}L${P1}L${P2}Z`, fill: st.head === 'hollow' ? t.paper : color, stroke: color, 'stroke-width': r1((st.head === 'hollow' ? 3 : 1.4) * k), 'stroke-linejoin': 'round' }, g);
    if (!opt.flat && st.head !== 'open') ctx.rough(head, 1);
    const tail = st.tail ? ctx.el('circle', { cx: pts[0][0], cy: pts[0][1], r: r1(sw * 1.9), fill: color }, g) : null;
    let len = 0;
    for (let i = 1; i < body.length; i++) len += Math.hypot(body[i][0] - body[i - 1][0], body[i][1] - body[i - 1][1]);
    return { g, lineG, head, tail, d, len, body, r: opt.r != null ? opt.r : Z.r };
  }

  function drawLabel(ctx, parent, pl, x, color, accent, Z, FN, R, w, halo, dim) {
    const L = pl.lab, t = ctx.t, g = ctx.el('g', { class: 'flow-label' }, parent);
    const out = { g, text: null, pill: null, mark: null };
    const label = x.label != null && x.label !== '' ? String(x.label) : '', value = x.value != null && x.value !== '' ? String(x.value) : '';
    if (L.text && (label || L.proof)) {
      const b = L.text, tw = b.x1 - b.x0 - L.mw;
      let tx, anchor;
      if (L.horiz) { anchor = 'middle'; tx = b.x0 + tw / 2; }
      else if (L.side) { anchor = 'end'; tx = b.x0 + tw; }
      else { anchor = 'start'; tx = b.x0; }
      const th = L.T.h, top = (b.y0 + b.y1) / 2 - th / 2;
      if (label) out.text = halo(ctx.rich(g, label, tx, top, Object.assign({}, FN.lab, { anchor, maxW: L.maxW, lines: 2, color, emColor: color, minSize: FN.lab.size * 0.8 })), Z.lab);
      if (L.proof) {
        const runs = out.text ? out.text.runs.filter(r => r.line === out.text.lines - 1) : [];
        const last = runs[runs.length - 1];
        const mx = last ? last.x + last.w + 8 + R : (L.pill ? L.pill.x1 + 6 + R : L.P[0] + R + 8);
        const my = last ? last.y - FN.lab.size * 0.34 : L.P[1] - (L.pill ? 0 : R + 6);
        out.mark = proofMark(ctx, g, L.proof, mx, my, R, w, dim);
      }
    } else if (L.proof) out.mark = proofMark(ctx, g, L.proof, L.pill ? L.pill.x1 + 6 + R : L.P[0], L.P[1], R, w, dim);
    if (L.pill && value) {
      const p = L.pill, pg = ctx.el('g', { class: 'flow-pill' }, g);
      ctx.el('rect', { x: r1(p.x0), y: r1(p.y0), width: r1(p.x1 - p.x0), height: r1(p.y1 - p.y0), rx: r1((p.y1 - p.y0) / 2), fill: t.paper, stroke: color, 'stroke-width': accent ? 2.4 : 2 }, pg);
      ctx.text(pg, value, (p.x0 + p.x1) / 2, (p.y0 + p.y1) / 2 + 1, Object.assign({}, FN.pill, { anchor: 'middle', valign: 'middle', color, lines: 1 }));
      out.pill = pg;
    }
    return out;
  }

  // tiny proof mark, chalk-talk 0.2 rules: ✓ ok (verified, cited), ? warn (inferred, unproven), ! error (broken)
  function proofMark(ctx, parent, proof, cx, cy, R, w, dim) {
    const st = proof.status, tone = st === 'verified' || st === 'cited' ? 'ok' : st === 'broken' ? 'error' : 'warn', c = dim(ctx.t[tone]);
    const g = ctx.el('g', { class: 'flow-proof flow-proof-' + st }, parent);
    const where = proof.file ? ` · ${proof.file}${proof.start ? `:${proof.start}-${proof.end}` : ''}${proof.hit ? ` (L${proof.hit})` : ''}` : '';
    ctx.el('title', {}, g).textContent = (w[st] || st) + (proof.why ? ': ' + proof.why : '') + where;
    ctx.el('circle', { cx: r1(cx), cy: r1(cy), r: R, fill: ctx.t.paper, stroke: c, 'stroke-width': 2, opacity: st === 'cited' ? 0.75 : 1 }, g);
    if (tone === 'ok') ctx.el('path', { d: `M${r1(cx - R * 0.42)} ${r1(cy + R * 0.02)}L${r1(cx - R * 0.1)} ${r1(cy + R * 0.36)}L${r1(cx + R * 0.45)} ${r1(cy - R * 0.36)}`, fill: 'none', stroke: c, 'stroke-width': r1(R * 0.22), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    else ctx.text(g, st === 'broken' ? '!' : '?', cx, cy + R * 0.04, { font: 'sans', weight: 700, size: R * 1.35, anchor: 'middle', valign: 'middle', color: c, lh: 1 });
    return g;
  }

  // draw along the route; the value pill rides the line to its spot; head, label and mark land after
  function animateFlow(ctx, defs, e, at, dur) {
    const { ln, lab, pl } = e;
    const id = ctx.id('flow-m');
    const m = ctx.el('mask', { id, maskUnits: 'userSpaceOnUse', x: -3000, y: -3000, width: 9000, height: 9000 }, defs);
    const mp = ctx.el('path', { d: ln.d, fill: 'none', stroke: '#fff', 'stroke-width': Math.max(40, pl.sw * 3), pathLength: 1, 'stroke-dasharray': '1 1.1' }, m);
    // the mask lives only while the line draws (natural state: no mask). A mask that stays on after its
    // animation ends is sometimes not repainted by Chrome when re-rendered (the line vanishes).
    const url = `url(#${id})`;
    ctx.anim(ln.lineG, [{ mask: url }, { mask: url, offset: 0.999 }, { mask: 'none' }], { at: 0, duration: at + dur, easing: 'linear' });
    ctx.anim(mp, [{ strokeDashoffset: '1.05px' }, { strokeDashoffset: '0px' }], { at, duration: dur, easing: EASE_DRAW });
    if (ln.tail) ctx.beat(ln.tail, 'pop', { at, dur: 320 });
    ctx.beat(ln.head, 'fade', { at: at + dur * 0.86, dur: 240, dy: 0 });
    if (!lab) return;
    if (lab.text) ctx.beat(lab.text.el, 'fade', { at: at + dur * 0.5, dur: 460, dy: 6 });
    if (lab.mark) ctx.beat(lab.mark, 'pop', { at: at + dur + 160, dur: 420 });
    if (lab.pill) {
      // keyframes along the drawn path, at offsets = distance / path length (rounded corners counted), so the
      // pill keeps pace with the drawing tip
      const pts = ln.body, L = pl.lab, P = L.P, segs = [];
      for (let i = 1; i < pts.length; i++) segs.push(Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const cut = i => (2 - Math.PI / 2) * Math.min(ln.r, segs[i - 1] / 2, segs[i] / 2);   // a rounded corner is shorter
      const total = mp.getTotalLength() || ln.len;
      let acc = 0;
      const kf = [{ offset: 0, opacity: 0, transform: `translate(${r1(pts[0][0] - P[0])}px,${r1(pts[0][1] - P[1])}px)` }];
      for (let i = 1; i <= L.si; i++) { acc += segs[i - 1] - cut(i); kf.push({ offset: Math.min(1, acc / total), opacity: 1, transform: `translate(${r1(pts[i][0] - P[0])}px,${r1(pts[i][1] - P[1])}px)` }); }
      const rest = Math.min(total, acc + Math.hypot(P[0] - pts[L.si][0], P[1] - pts[L.si][1]));
      kf.push({ offset: rest / total, opacity: 1, transform: 'translate(0px,0px)' }, { offset: 1, opacity: 1, transform: 'translate(0px,0px)' });
      const fadeIn = Math.min(0.06, kf[1].offset / 2);
      if (fadeIn > 0) kf.splice(1, 0, { offset: fadeIn, opacity: 1, transform: lerpT(kf[0], kf[1], fadeIn) });
      ctx.anim(lab.pill, kf, { at, duration: dur, easing: EASE_DRAW });
    }
  }
  function lerpT(k0, k1, off) {
    const p = s => s.transform.match(/-?[\d.]+/g).map(Number), a = p(k0), b = p(k1), u = (off - k0.offset) / (k1.offset - k0.offset);
    return `translate(${r1(a[0] + (b[0] - a[0]) * u)}px,${r1(a[1] + (b[1] - a[1]) * u)}px)`;
  }

  // the key: one short sample line per type on screen, plus "accent = new"
  function legend(ctx, types, hasNew, w, Z, tall, stamp) {
    const g = ctx.el('g', { class: 'flow-legend' }, ctx.stage);
    const items = types.map(ty => ({ ty, label: w[ty] }));
    if (hasNew) items.push({ ty: 'new', label: w.new });
    const M = tall ? 48 : 72, sw = tall ? 64 : 56, gap = tall ? 14 : 12, sp = tall ? 34 : 34, rowH = tall ? 50 : 38;
    const maxX = ctx.W - M - (stamp ? (tall ? 250 : 300) : 0);
    let x = M, y = tall ? 48 : 40, bottom = items.length ? y + rowH / 2 : 0, row = null;
    const f = { font: 'sans', size: Z.leg, weight: 400 }, rows = [];
    for (const it of items) {
      const tw = ctx.measure(it.label, f), need = sw + gap + tw;
      if (x > M && x + need > maxX) { x = M; y += rowH; bottom = y + rowH / 2; row = null; }
      if (!row) rows.push(row = { g: ctx.el('g', {}, g), w: 0 });
      if (it.ty === 'new') ctx.el('path', { d: `M${x} ${y}H${x + sw}`, stroke: ctx.t.accent, 'stroke-width': 4.6 * Z.k, 'stroke-linecap': 'round', fill: 'none' }, row.g);
      else drawLine(ctx, row.g, [[x, y], [x + sw, y]], it.ty, ctx.t.ink, Z, { r: 0, flat: true });   // the key stays crisp
      ctx.text(row.g, it.label, x + sw + gap, y, Object.assign({}, f, { valign: 'middle', color: it.ty === 'new' ? 'accent' : 'ink2', lh: 1, lines: 1 }));
      row.w = x + need - M;
      x += need + sp;
    }
    // after the fit: one quiet strip just above the drawing, flush with its right edge (left with a stamp)
    const place = (d0, d1, top) => {
      const dy = Math.max(0, top - (tall ? 30 : 26) - bottom);
      rows.forEach(r => {
        const x0 = clamp(stamp ? d0 : d1 - r.w, M, ctx.W - M - r.w);
        r.g.setAttribute('transform', `translate(${r1(x0 - M)} ${r1(dy)})`);
      });
    };
    return { g, bottom, place };
  }
})();


/* ---- lens-card.js ---- */
/* chalk-talk frames · lens-card: number, whatif, compare, screen, timeline
 *
 * The editorial lenses (Dan Roam's "how much", "what if", "why / what changes", "what it looks like", "when").
 * Fields (SPEC.md):
 *  number   big ("1.240 ₺", "%31", "3,1 milyon"), label, sub, who (cast id → small head byline),
 *           viz { kind: bars | dots | line | donut | icons, data: [{ label, value, accent }], unit, format, icon }
 *  whatif   headline, vars [{ id, label, min, max, step, value, unit }], outputs [{ label, expr, format, accent }],
 *           viz (as number, but data items may carry `expr` instead of `value`; redrawn live)
 *  compare  left / right { label, tone: muted | accent, lines (≤3), art: icon name | { icon } | { people, props } },
 *           or before / after { label, lines, people, props } (drawn as muted / accent sides)
 *  screen   device: phone | laptop, ui [{ type, text, items, label, value, sub, accent }], annotate [{ at, text }]
 *  timeline items [{ when, what, accent }] (≤ 6)
 * Extras: viz.format ('₺' | '%' | 'n' | 'x') formats data values; outputs[].accent picks the accent tile
 * (default: the last output); viz.icon picks the icons-kind glyph (default person).
 * Whatif expressions: numbers, var ids, + - * / ( ), unary minus; × · ÷ − – are accepted as aliases. Never eval'd.
 */
(function () {
  'use strict';

  const WORDS = {
    tr: { before: 'Önce', after: 'Sonra' },
    en: { before: 'Before', after: 'After' },
  };
  const words = ctx => WORDS[String(ctx.lang).slice(0, 2)] || WORDS.en;
  const isTall = ctx => ctx.aspect === 'tall';
  const arr = v => (Array.isArray(v) ? v : v == null ? [] : [v]);
  const fin = v => typeof v === 'number' && isFinite(v);
  const str = v => (v == null ? '' : String(v));

  /* ---------- numbers ---------- */
  const NF = new Map();
  function nf(lang, o) {
    const k = lang + '|' + JSON.stringify(o || {});
    let f = NF.get(k);
    if (!f) { try { f = new Intl.NumberFormat(lang, o); } catch (_) { f = new Intl.NumberFormat('en', o); } NF.set(k, f); }
    return f;
  }
  // ₺ → "1.240 ₺" (tr) / "1,240 ₺" (en); % → "%31" (tr) / "31%" (en); x → "2,5×"; n → plain
  // $ € £ → Intl currency in the story lang ("$1,240", "1.240 €"); "currency" + an ISO `currency` code ("JPY")
  // a trailing "k" ("$k", "₺k", "nk"), format "compact" or compact: true → short compact ("$22k", "3,1 mn ₺"); ≥ 1e6 is always compact
  const CUR = { $: 'USD', '€': 'EUR', '£': 'GBP', '₺': 'TRY' };
  const isFmt = f => /^((\$|€|£|₺|%|x|×|n|currency)k?|compact)$/.test(str(f));
  const spec = o => (o && typeof o === 'object' ? { format: o.format, currency: o.currency, compact: o.compact } : { format: o });
  function fmt(v, f, lang) {
    if (!fin(v)) return '—';
    f = spec(f);
    let format = str(f.format || 'n'), short = !!f.compact;
    if (format === 'compact') format = 'nk';
    if (format.length > 1 && format.endsWith('k')) { format = format.slice(0, -1); short = true; }
    const big = Math.abs(v) >= 1e6;
    const c = short && Math.abs(v) >= 1e3 ? { notation: 'compact', compactDisplay: 'short', maximumFractionDigits: Math.abs(v) < 1e4 || big ? 1 : 0 }
      : big ? { notation: 'compact', compactDisplay: 'long', maximumFractionDigits: 1 } : null;
    const tidy = s => s.replace(/(\d)\s?K\b/, '$1k').replace(/\bMn\b/, 'mn').replace(/\bMr\b/, 'mr').replace(/(\d) B\b/, '$1 b');   // "$22k", "3,1 mn"
    const code = format === 'currency' ? str(f.currency).toUpperCase() : CUR[format];
    switch (format) {
      case '%': return nf(lang, { style: 'percent', maximumFractionDigits: Math.abs(v) < 10 && v % 1 ? 1 : 0 }).format(v / 100);
      case 'x': case '×': return nf(lang, { maximumFractionDigits: 1 }).format(v) + '×';
      case '₺': return tidy(nf(lang, c || { maximumFractionDigits: 0 }).format(v)) + ' ₺';   // Turkish style, symbol after, in every lang
      case 'n': return tidy(nf(lang, c || { maximumFractionDigits: Math.abs(v) < 100 ? 1 : 0 }).format(v));
      default: {
        if (!/^[A-Z]{3}$/.test(code || '')) return fmt(v, Object.assign({}, f, { format: short ? 'nk' : 'n' }), lang);
        const o = Object.assign({ style: 'currency', currency: code, currencyDisplay: 'narrowSymbol' }, c || { maximumFractionDigits: Math.abs(v) < 100 && v % 1 ? 2 : 0 });
        return tidy(nf(lang, o).format(v));

  function fmtUnit(v, unit, lang) {
    if (isFmt(unit)) return fmt(v, unit, lang);

  }

  /* ---------- whatif expressions: a tiny recursive-descent parser, never eval ---------- */
  function compile(src, ids) {
    const s = str(src).replace(/[×·]/g, '*').replace(/[−–]/g, '-').replace(/÷/g, '/');
    const toks = s.match(/\d+(?:\.\d+)?|\.\d+|[A-Za-z_]\w*|[-+*/()]|\S/g) || [];

      if (tk === '-') { p++; const f = prim(); return e => -f(e); }
      if (tk === '+') { p++; return prim(); }

  /* ---------- shared ink pieces ---------- */
  function swash(ctx, parent, x0, x1, y, th, seed) {   // same brush stroke as the title lens
    const r = ctx.rand('swash-' + seed), w = x1 - x0, lift = th * (0.5 + r() * 0.6);
    const d = `M${x0} ${y + th * 0.25}`
      + `C${x0 + w * 0.3} ${y - th * 0.35} ${x0 + w * 0.68} ${y - th * 0.55 - lift} ${x1} ${y - lift - th * 0.15}`
      + `C${x1 - w * 0.02} ${y - lift + th * 0.35} ${x0 + w * 0.7} ${y + th * 0.25 - lift * 0.4} ${x0 + w * 0.32} ${y + th * 0.75}`
      + `C${x0 + w * 0.15} ${y + th * 0.95} ${x0 + w * 0.04} ${y + th * 0.85} ${x0} ${y + th * 0.25}Z`;
    return ctx.rough(ctx.el('path', { d, fill: ctx.t.accent, opacity: 0.92 }, parent), 1);
  }
  function headline(ctx, parent, src, x, y, o) {
    const hl = ctx.rich(parent, src, x, y, Object.assign({ weight: 500, lh: 1.04, ls: -0.018, balance: true }, o));
